key_idea: "When every visible packet payload is byte-for-byte identical ('boring'), the exfiltration channel is the metadata, not the payload: filter packets by a side attribute (TTL here) to separate signal from injected noise, then decode the signal from inter-packet timing deltas as a two-level (short/long delay) binary channel."
