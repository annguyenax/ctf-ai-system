signals:
  - "pcap magic bytes corrupted (0xC4C3B2A1 instead of 0xD4C3B2A1); fixing byte 0 repairs the file."
  - "504 UDP packets, same src/dst, identical 4-byte ASCII payload 'PING' on every packet -> payload itself carries no data."
  - "Two distinct TTL values among otherwise-identical packets: TTL=64 beacon packets vs TTL=113 injected noise packets to be filtered out."
  - "Inter-packet arrival delay between consecutive TTL=64 packets clusters into two bands (~50ms vs ~150ms) -> binary 0/1 encoding."
