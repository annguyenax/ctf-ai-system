exploitation_pattern: "repair pcap magic byte -> parse packets manually with struct -> split by TTL into beacon vs noise -> compute inter-arrival deltas of beacon packets only -> threshold deltas into bits (short=0, long=1) -> pack 8 bits/byte MSB-first -> XOR with repeating key recovered from the beacon source-port pattern -> flag"
