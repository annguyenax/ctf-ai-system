signals:
  - Login UI only ever displays a generic "Login failed" message, hiding whatever the server actually returns.
  - "Frontend JS source (readable via view-source) has a comment hinting the real response body may contain more than the UI chooses to show, and to check network traffic."
  - "/api/login accepts JSON {username, password} and is vulnerable to classic boolean SQL injection in the username field."
key_idea: A login form showing only a generic error message does not mean the backend response is equally minimal — always inspect the raw HTTP response body (not just what the UI renders) when probing authentication, especially after a classic SQLi payload (`' OR '1'='1`) in a credential field; here the server echoed full account details and the flag directly in the JSON body despite the UI showing a fixed "Login failed" string.
prerequisites:
  - Ability to read page source / network requests (view-source, browser devtools, or just curl the API directly)
  - A standard SQLi payload against a username field backed by string-concatenated SQL
exploitation_pattern: view page source for hints (comments about hidden response content) -> POST /api/login with username="' OR '1'='1" and any password -> read the full raw JSON response (not the UI's rendered message) -> flag/credentials are directly in the response body.
verification:
  method: Raw JSON response to the SQLi payload contained an account object with a literal "flag" field matching final_flag.txt.
