signals:
  - "A web app claims to generate 'every' 7x7 nonogram (2,427,000 total via 2427 xorshift64 seeds x 1000 puzzles each), but the generator deliberately permutes/overrides hints so that almost all generated puzzles are internally contradictory (unsolvable)."
  - "On successfully solving a puzzle, a 49-bit solution-grid bitmask feeds a splitmix64-based hash construction (`cellBits`) whose output XORs against a fixed seed table to produce the flag's base32 characters -- i.e. the flag is only computable once you find the ONE solvable puzzle index out of 2.4M."
  - "A quick parity check (sum of row-hint 1-bits must equal sum of column-hint 1-bits) prunes almost all of the 2.4M candidates cheaply before running a full backtracking nonogram solver on the rest."
key_idea: "When a generator claims exhaustive coverage of a huge discrete puzzle space but most instances are provably unsolvable by construction, don't try to find the flaw analytically -- write a parallel (OpenMP) brute-force solver that cheaply prunes by an invariant (row/col 1-bit count parity) before running a full backtracking solve on survivors, since the intended solution is simply to locate the single solvable instance."
prerequisites:
  - "WASM data-segment extraction (LEB128 parsing)"
  - "nonogram/Picross backtracking solver"
  - "basic OpenMP parallelism"
exploitation_pattern: "extract WASM data segments (seed table, override bitmap) via a hand-rolled LEB128 parser -> reimplement the xorshift64/hint-derivation logic in C -> parity-prune candidates -> backtracking-solve survivors in parallel -> on the unique solvable index, compute cellBits and decode the base32 flag string."
