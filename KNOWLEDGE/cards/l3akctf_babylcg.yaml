signals:
  - "state = (a*state + c) % m"
  - modulus m disclosed in output
  - three consecutive LCG outputs disclosed (s0,s1,s2)
  - next output used as XOR keystream on flag
key_idea: >
  Known-modulus LCG recovery. With m and 3 consecutive states, subtract two
  recurrences to cancel c: a = (s2-s1)*inv(s1-s0) mod m; c = s1-a*s0; then predict
  next output key = a*s2+c and XOR with ciphertext.
prerequisites:
  - modular-arithmetic
  - modular-inverse
  - lcg
exploitation_pattern: recover a via diff-of-recurrences -> recover c -> predict next output -> XOR decrypt -> verify by replaying recurrence
verification:
  method: deterministic solver replay + LCG recurrence asserts + clean ASCII flag with correct L3AK{} framing
  evidence: ../CTFTimeWriteup/L3akCTF2026/Beginner/BabyLCG/solve/evidence/manifest.md
pitfalls:
  - using the sample m hard-coded in chall.py instead of the real m from output.txt
  - flag longer than modulus byte-length (33B flag vs 256-bit m) — do not reduce flag_int mod m
  - s1-s0 not invertible if gcd(s1-s0,m) != 1 (general case needs gcd handling)
