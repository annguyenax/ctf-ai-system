pitfalls:
  - "`memcpy(dst, src, chunk->size)` after a realloc-to-smaller-size call is a textbook arena-boundary overflow -- check every custom allocator's resize path for whether it uses the OLD size, the NEW size, or min() of the two."
  - "Globals placed immediately after a static arena with no guard gap become directly overwritable by any arena-overflow primitive; once overwritten, make the primitive durable by pointing the array AT ITSELF so subsequent writes don't need to repeat the original overflow trigger."
