signals:
  - "A custom allocator's `turbo_realloc` calls `memcpy(new_memory, chunk->memory, chunk->size)` using the OLD (larger) chunk size regardless of the new (smaller) requested size, so shrinking an allocation copies stale bytes past the new allocation's actual bound."
  - "The 1MB static memory arena is immediately followed in memory by global control variables (`head` free-list pointer, then `notes[16]` pointers, then `note_sizes[16]`), with no gap or guard."
  - "By sizing the arena-adjacent allocation precisely (allocate most of the arena, then a specific-size note right at the boundary), the realloc-driven overflow lands forged pointer values exactly into `notes[]`/`note_sizes[]`, turning a one-shot OOB write into a permanent, repeatable arbitrary-read/write primitive (point a note slot at any address with any fake 'size')."
key_idea: "Exploit a realloc that copies the OLD size instead of min(old,new) by placing the vulnerable allocation flush against the arena's end so the overflow spills into global bookkeeping arrays right after it, then self-referentially overwrite the notes array itself with new entries pointing at GOT/environ/stack targets to build a durable arbitrary-read/write primitive, finally scanning the leaked stack for `main`'s saved RIP and chaining pop_rdi/'/bin/sh'/system via the exit path."
prerequisites:
  - "custom allocator / arena-adjacent-global exploitation reasoning"
  - "GOT leak -> libc base -> environ -> stack-scan-for-return-address technique"
  - "No-PIE ROP chain construction"
exploitation_pattern: "fill most of the arena -> allocate a boundary note of the exact size that reallocs into global-table territory -> forge target table entries in the note's payload -> trigger realloc(small_size) to overflow them into notes[]/note_sizes[] -> leak libc via GOT entry -> leak stack via environ -> scan backward for saved RIP -> write pop_rdi;'/bin/sh';system ROP chain over it -> trigger return via the menu's exit path."
