pitfalls:
  - "An HttpOnly cookie cannot be overwritten directly by injected JavaScript, but it is NOT immune to being evicted by the browser's own cookie-quota/priority eviction policy if it shares a lower priority tier with attacker-controlled cookies."
  - "Order matters: the attacker's override cookie must be set LAST (newest) among the flood of junk cookies so it is the one that survives eviction, not one of the junk entries."
