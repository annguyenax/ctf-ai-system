pitfalls:
  - A flat/naive multi-escape of the blocked token does nothing by itself; the extra decode pass must be driven by the application's own recursive chunk-resolution logic, not by the attacker pre-decoding anything.
failed_paths:
  - "Simply re-escaping the string without wrapping it in a second resolved_model chunk did not bypass the filter, since Next.js only decodes the top-level JSON once."
