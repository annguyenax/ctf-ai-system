signals:
  - "WAF blocks the literal substring ':constructor' and also its single-level JSON-escaped form ':\\u0063onstructor', but not a double-escaped form ':\\u005cu0063onstructor'."
  - "The React Flight protocol (React Server Components wire format) decodes a request's JSON value exactly once per chunk, so a naively double-escaped payload does not self-unwrap."
key_idea: >
  To get a value JSON-decoded a second time without the framework doing it for
  you, abuse the react2shell primitive itself: a Chunk whose "then" property is
  set to Chunk.prototype.then (reached via "$1:__proto__:then") executes with
  `this` bound to the chunk's own value, and resolving that chunk value as
  "resolved_model" re-runs it through JSON.parse + reviveModel. Nesting one
  resolved_model chunk inside another's `value` field turns a single JSON
  object into a multi-pass decode pipeline, so a WAF-blocked token escaped N
  times only becomes dangerous after N framework-driven decode passes -- passes
  the WAF never sees happen on its own single decode of the wire body.
prerequisites:
  - Working understanding of React Flight Protocol chunk references ($N, $N:a:b, $Qn, $@n, $F, $B)
  - A first-stage parser-differential or injection primitive to plant the nested resolved_model chunk at all
exploitation_pattern: >
  Construct nested chunks: outer chunk's `then` = "$1:__proto__:then" (reaches
  Chunk.prototype.then); outer chunk's `value` is itself a JSON string
  containing another resolved_model chunk whose own `value`/`_formData`/`_prefix`
  carry the react2shell RCE primitive with the target token escaped one extra
  level (`:\u005cu0063onstructor`) -> framework's own recursive chunk resolution
  decodes the inner JSON a second time, producing the real `:constructor` only
  after the WAF's single-pass scan already passed the request.
