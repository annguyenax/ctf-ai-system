signals:
  - A forum thread hints that "public keys" for some account are openly viewable "right there in the files" of a repository host.
  - GitHub exposes every account's SSH public keys at the unauthenticated, undocumented-feeling but standard URL `https://github.com/<username>.keys`.
  - Among the real SSH key lines, one entry is a crafted fake key whose body embeds the flag text (obfuscated flag delimiters, e.g. custom characters instead of `{`/`}`).
key_idea: GitHub serves a plaintext list of every user's public SSH keys at `https://<host>/<username>.keys` with no auth required; when OSINT needs to find something a user "left in their keys," check that endpoint directly rather than searching repos/commits for key material.
prerequisites:
  - A known or discoverable GitHub username for the target (often chained from a prior OSINT challenge)
exploitation_pattern: resolve target's GitHub username (from a previous OSINT step) -> GET https://github.com/<username>.keys -> scan the returned key list for an entry that doesn't parse as a normal key / contains flag-shaped text -> de-obfuscate per the challenge's custom flag-delimiter format.
