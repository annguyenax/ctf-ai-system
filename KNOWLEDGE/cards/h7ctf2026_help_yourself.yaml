time_heuristic: "For any mobile-app CTF challenge claiming a note/field is \"agent-only\"/hidden, decompile the client to learn its raw API handshake and read the full JSON response yourself -- client-side-only field hiding (no server-side authorization) is one of the most common mobile-API flaws, and the same pattern recurs across different apps in the same event (e.g. H7CTF2026 Onyx Locker)."
