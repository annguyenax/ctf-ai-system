signals:
  - unbalanced primes (607-bit and 521-bit) -> Fermat won't work
  - N in hex shows long runs of 0xFF then 0x00 (near 2^1128)
  - primes shaped p=2^607-a, q=2^521-b with tiny a,b
key_idea: >
  Mersenne-void primes. p=2^607-a, q=2^521-b => N = 2^1128 - b*2^607 - a*2^521 + a*b.
  a*b = N mod 2^521 (tiny, exact); b = (2^1128 - N) >> 607; a = a*b/b. Rebuild p,q, decrypt.
prerequisites:
  - rsa
  - modular-arithmetic
  - binary-structure-inspection
exploitation_pattern: view N in hex -> spot near-power-of-2 -> N mod 2^bq = a*b, top of 2^(bp+bq)-N = b -> factor -> RSA decrypt
verification:
  method: p*q == N exact + clean ASCII flag with L3AK{} framing
  evidence: ../ctf-ai-system/OUTPUT/_archive/L3akCTF2026/Crypto/RSA Eclipse/solve/evidence/manifest.md
pitfalls:
  - trying Fermat on unbalanced primes (they are far apart, ~2^86)
  - trusting a pre-existing solve/ stub (old one only built pub.key)
failed_paths:
