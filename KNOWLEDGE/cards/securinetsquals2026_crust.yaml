pitfalls:
  - "Freeing an object through its 'normal' interface (nulling a slot table) does not guarantee every other data structure that cached a reference to it (a registry, cache, or index) was also invalidated -- audit every place a raw pointer+type-tag pair could be cached independently of the primary ownership table."
  - "Activating through the stale alias WITHOUT first reclaiming the freed chunk fails the magic check against leftover tcache fd/key bytes ('bad config', a free-chunk's own linked-list metadata) -- this failure is itself a signal that a dangling-pointer activation path exists and is reachable, just not yet armed."
failed_paths:
  - "A DataNode-reuse + generic `w`rite command path should theoretically also work to set fn_ptr/magic, but in practice the `w` command invalidated the shadow record's nonce ('wrong nonce'); the SentryNode-key path avoided `w` entirely and worked on the first attempt (root cause of the nonce invalidation not investigated further since an alternative worked)."
