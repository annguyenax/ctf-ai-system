signals:
  - "A Rust `dyn Node` trait-object menu binary frees a slot's backing memory on `f)ree` and NULLs the slot-table entry, but a SEPARATE 'shadow registry' (populated by `r)egister`) still keeps its own copy of the freed node's raw pointer AND its concrete-type vtable, independent of the slot table."
  - "All three concrete node types (`DataNode`, `SentryNode`, `ExecNode`) are allocated with the identical fixed size (`alloc(0x90)`), so freeing an `ExecNode` and immediately creating a `SentryNode` reliably reuses the exact same heap chunk (tcache LIFO, same size class)."
  - "`ExecNode::activate` checks only that a hardcoded magic field equals a constant and then unconditionally `call`s whatever pointer sits at offset 0 of the node -- no validation that the pointer is one of the type's own legitimate handler functions."
key_idea: "When a menu-driven heap challenge has a trait-object dispatch where `activate`/similar performs an unchecked indirect call through a type-confused vtable slot, and a SEPARATE bookkeeping structure (a 'shadow registry', cache, or similar) retains a stale pointer+type-tag pair after the underlying object is freed, reclaim the freed chunk with a same-size, attacker-controlled-content type (here `SentryNode`'s 32-byte key buffer) to overwrite the dead object's function-pointer and magic fields directly, then trigger the stale alias's execution path to get an arbitrary call."
prerequisites:
  - "Rust trait-object (dyn Trait) vtable layout"
  - "tcache LIFO same-size-class chunk reuse"
  - "heap UAF-via-dangling-alias reasoning"
exploitation_pattern: "create an ExecNode (magic pre-armed) -> register it, caching the shadow record (pointer+ExecNode-vtable) -> free the ExecNode (slot table nulled, shadow record untouched) -> create a SentryNode (reuses the freed chunk) whose attacker-controlled key bytes overwrite the dead ExecNode's fn_ptr and magic fields with the win-function address and the required magic constant -> activate via the stale shadow record, which dispatches through the cached ExecNode vtable onto the now-SentryNode-owned memory, calling the forged function pointer."
