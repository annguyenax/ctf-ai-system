signals:
  - "`IoCreateDeviceSecure` is called with SDDL `D:P(A;;GA;;;SY)(A;;GA;;;BA)(A;;GRGW;;;BU)` -- the Builtin Users (BU) SID gets Generic Read + Generic Write on the device object, so ANY logged-in user can open \\Device\\VulCreator without needing admin."
  - "Imports include TDI.SYS (`TdiRegisterDeviceObject`, legacy network stack -- often an address-leak vector), registry Class-key APIs (`ZwOpenKey`/`ZwQueryValueKey`/`ZwSetValueKey`), security-descriptor APIs, and raw string ops (`_wcsnicmp`/`wcschr`) on what are likely user-controlled device-name/registry strings."
key_idea: "A custom Windows kernel driver's own device security descriptor (SDDL) is the first thing to check -- here Builtin Users were granted GR+GW on the device, meaning the entire IOCTL/registry-parsing surface is reachable from a standard low-privilege account with zero prerequisite exploit, significantly widening the attack surface for an otherwise 'secure' driver."
prerequisites:
  - "Windows kernel driver reverse engineering (IOCTL dispatch, IoCreateDeviceSecure SDDL syntax)"
  - "WinDbg/Ghidra for DriverEntry + MajorFunction analysis"
exploitation_pattern: "parse the device SDDL to confirm low-priv access -> enumerate IOCTL codes from the MajorFunction dispatch switch -> map InputBuffer/OutputBuffer length handling per IOCTL for METHOD_NEITHER misuse, TDI object leaks, or registry/device-name parsing overflows."
