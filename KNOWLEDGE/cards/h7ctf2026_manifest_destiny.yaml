exploitation_pattern: "probe vararg offset with marker+%N$p -> leak adjacent stack pointers to confirm binary base / non-PIE -> optionally %s-leak arbitrary memory to reverse-engineer logic with no binary -> build \"%1c%K$hhn\" + padding-to-alignment + packed target address at vararg slot K -> send -> target global flips non-zero -> call the now-unlocked action for the flag."
