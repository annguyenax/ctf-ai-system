key_idea: "When no binary is given for a format-string bug, bootstrap entirely from the live service: find the varargs offset of your own buffer by sending a probe like \"AAAAAAAA%N$p\" for increasing N until it echoes back your marker bytes as a pointer value, then use %<offset+1>$p leaks of adjacent stack slots to confirm non-PIE/PIE and recover code pointers (binary base), and if you need to read further memory, place a target address at a known vararg offset and use %<offset>$s to dereference-and-print it as a string (dumping .text byte-by-byte if needed to reverse logic with no local binary at all). Finally, use %<n>c%<offset>$hhn to write a single byte (or %hn/%n for wider writes) to any address you've placed in the vararg stream, e.g. to flip an in-memory \"admin\" gate variable to non-zero."
prerequisites:
