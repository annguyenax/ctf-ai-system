pitfalls:
  - "The only nonlinear term in the commutator expansion is the cross-product of the two unknown key matrices; bound it (bytes in [0,255]) and treat the whole system as a tiny-error linear system rather than fully nonlinear."
  - "After recovering the first matrix exactly, the remaining unknown's solution space is NOT a point -- it's an affine family of dimension equal to the centralizer of the recovered matrix (dimension 10 here); a naive single linear solve under-determines it and still needs a small CVP."
