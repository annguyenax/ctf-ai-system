signals:
  - "Each testcase publishes U_i = A^(e_i) + K_i for 3 random exponents e_i of the SAME secret matrix A, where K_i is a 10x10 byte matrix (the XOR key reshaped)."
  - "Powers of the same matrix A commute: [A^e1, A^e2] = 0, which is a public, checkable linear identity once K_i is subtracted out."
key_idea: "Exploit that distinct integer powers of one matrix commute. Writing U_i = M_i + K_i, the commutator [U1-K1, U2-K2]=0 expands to a linear equation in the unknown key bytes plus one small nonlinear cross term [K1,K2] bounded by ~2^19; treat it as a near-linear (BDD/LWE-style) system and recover K1, K2 via lattice reduction (LLL), then recover K3 by a plain linear solve against the now-known M1 (using the centralizer dimension to bound the residual affine family) and a small CVP over the remaining low-dimensional space."
prerequisites:
  - "Matrix algebra over a prime field (commutators, centralizers)"
  - "Lattice basis reduction (LLL) / bounded-distance decoding and CVP"
  - "Recognizing BDD/LWE structure in a non-standard crypto scheme"
exploitation_pattern: "same-base matrix powers published with additive key noise -> use commutativity to build a linear system in the unknown keys with one small nonlinear term -> LLL-solve as BDD -> recover first two keys exactly -> use the now-known clear matrix to linearly solve for remaining keys via centralizer dimension + small CVP -> XOR-recover the flag from all 15 keys across testcases."
