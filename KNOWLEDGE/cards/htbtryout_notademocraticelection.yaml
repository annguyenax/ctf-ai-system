signals:
  - "getVoterSig() computes abi.encodePacked(_name, _surname) with no delimiter between the two dynamic strings."
  - "uniqueVoters[_name][_surname] keys by the separate (name, surname) pair, while voters[voterSig] keys by the packed concatenation, so the two mappings can disagree about identity."
  - "vote() has no per-voter-weight consumption/limit, so the same weighted sig can be voted again and again."
key_idea: "abi.encodePacked on two dynamic strings is ambiguous: (\"SatoshiNakamoto\", \"\") packs to the same bytes as (\"Satoshi\", \"Nakamoto\"). Depositing under a (name, surname) split that collides with an already-funded voter's packed signature inherits that voter's full weight under the uniqueness-check mapping, and since vote() never decrements or caps a voter's usage, repeated calls multiply the inherited weight past the win threshold."
prerequisites:
  - "Solidity contract using abi.encodePacked on >=2 dynamic-length arguments as a mapping key or identity"
  - A separate uniqueness check keyed by the un-packed arguments, letting the two representations diverge
exploitation_pattern: "pick (name,surname) split that abi.encodePacked-collides with a known funded voter -> inherit their weight via the shared packed-key mapping -> repeat unlimited vote() calls (no consumption) to cross target threshold"
verification:
  method: "On-chain replay against the Anvil RPC instance: 1 collision deposit + 10 vote() calls flipped winner() to CIM and Setup.isSolved() returned true; tx hashes recorded."
