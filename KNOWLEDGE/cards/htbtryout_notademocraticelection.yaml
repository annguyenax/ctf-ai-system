pitfalls:
  - "abi.encodePacked(string,string,...) (or any >=2 dynamic types) is never safe as a unique identifier/mapping key; use abi.encode (length-prefixed) or hash the individually length-prefixed fields instead."
  - "Any action that reads a per-identity weight but doesn't consume/cap it per call is replayable without bound."
