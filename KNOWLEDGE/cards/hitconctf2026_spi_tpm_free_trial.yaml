signals:
  - "`get_flag` encrypts the flag once at boot under key-id 1 with a huge COST (also used as an internal round count) and caches the ciphertext; any client can later `encrypt 1 <small cost> <chosen hex>` using that exact key with no ACL on the key id -- a chosen-plaintext oracle under the flag's own key."
  - "`decrypt` on the flag's own blob is separately blocked by cost-weighted budget math (COST*(ceil(len/4)+256) vastly exceeds the 1024 budget) and the cost field is cryptographically bound into the tag, so it can't be tampered down."
  - "The home-grown cipher's high words (ct_word[m+5]...) are a 32-bit-block cipher chained through a public 6-round Feistel (F1) and a cost-round Feistel keyed by K0,K1 (F2); at COST=1 each chosen-plaintext query leaks exactly 16 bits of a correct, live-validated SMT model of K0,K1."
key_idea: "Reduce the home-grown TPM cipher's key recovery to a 128-bit SMT problem over K0,K1 using a single-round (COST=1) chosen-plaintext oracle that leaks 16 bits per query, validated bit-exact against the real firmware via a dlopen black-box harness -- but both Z3 and bitwuzla (bitblast and local-search backends, 600-1200s) return `unknown`, indicating a genuine solver-performance wall rather than a modeling bug."
prerequisites:
  - "QEMU device-model plugin reverse engineering (host-side .so, not guest code)"
  - "SplitMix64/xorshift-multiply mix function analysis"
  - "SMT modeling of bitvector round functions"
exploitation_pattern: "no-ACL key id -> same-key chosen-plaintext oracle at trivial cost -> per-query 16-bit leak of K0,K1 -> SMT/algebraic key recovery -> reconstruct/decrypt the flag's own cached ciphertext offline (no budget limit applies locally)."
verification:
