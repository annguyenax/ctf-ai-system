pitfalls:
  - "A field that is both a service-level 'cost' and an internal cryptographic round count can make `decrypt` on a high-cost ciphertext infeasible under the service's own resource budget even with a full key break -- don't assume decrypt-the-real-blob is the intended final step; recompute offline using the public header fields instead."
  - "When a from-scratch SMT encoding of a custom cipher 'should' work but both Z3 and bitwuzla return unknown even at small N, suspect an analytically invertible stage (odd-constant xorshift-multiply mixes are invertible mod 2^64) that would shrink the search before reaching for a different solver."
failed_paths:
