  evidence: "D:/download/ctf-ai-system/OUTPUT/_archive/ByteMeCTF2026/Cryptography/Vormir Common Modulus/solve/solve.py"
pitfalls:
  - Python's built-in pow() raises ValueError on negative exponents with a modulus argument prior to the modinv fallback; must branch on sign of s1/s2 and invert the ciphertext first.
  - This attack requires the *same* modulus and *same* plaintext across both ciphertexts — verify both before attempting, otherwise the recovered "m" is meaningless.
