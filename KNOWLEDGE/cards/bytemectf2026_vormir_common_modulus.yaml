signals:
  - Same RSA modulus n encrypts the same plaintext m under two coprime public exponents e1, e2 (c1 = m^e1 mod n, c2 = m^e2 mod n).
  - gcd(e1, e2) == 1.
key_idea: Common-modulus attack. Use the Extended Euclidean Algorithm to find integers s1, s2 with s1*e1 + s2*e2 = 1 (Bezout). Recover m = c1^s1 * c2^s2 mod n without ever factoring n or knowing the private key. If either s_i is negative, use modular inverse of the corresponding ciphertext raised to the absolute value of that exponent instead of a negative pow().
prerequisites:
  - Extended Euclidean Algorithm implementation
  - Python pow(x, -1, n) or manual modinv for negative Bezout coefficients
exploitation_pattern: same n, coprime e1/e2, same plaintext -> egcd(e1,e2) -> m = c1^s1 * c2^s2 mod n (handling negative exponents via modular inverse) -> decode m to ASCII flag.
verification:
