signals:
  - "A ?format= query parameter is concatenated unsanitized into a shell command string: \"date '+\" . $format . \"' 2>&1\", then run via PHP exec()."
  - "PHP's exec() returns only the last line of combined stdout/stderr, not the full output stream."
  - "The target secret file (/flag) has no trailing newline, so naive command injection payloads can push the flag out of exec()'s single captured line or get it swallowed by later error output."
key_idea: "Breaking out of the single-quoted date format argument with a closing quote and semicolon lets you inject arbitrary commands, but PHP's exec() silently discards all but the last output line; craft the injected command sequence (and use a trailing comment # instead of leftover quote syntax) so that `cat /flag` output is forced to be the actual last captured line, accounting for the flag file's missing trailing newline."
prerequisites:
  - Unsanitized shell-command string concatenation with single-quote-delimited user input
  - "Awareness that exec() (unlike shell_exec/system) returns only the final output line, which changes payload construction (trailing # comment vs relying on command chaining to '' close cleanly)"
exploitation_pattern: "break out of single-quoted command argument (' ; cat /flag # ) -> trailing # comments out the rest of the original command syntax -> exec()'s last-line capture contains the flag"
verification:
  method: "Direct GET request with the crafted format parameter returned the flag embedded in the rendered <h1> time string; a second payload variant was verified to return the identical flag."
  evidence: "D:/download/ctf-ai-system/OUTPUT/_archive/HTB-TryOut/web/TimeKORP/final_flag.txt"
pitfalls:
  - "PHP's exec() returns only the last line of output; when injecting multiple commands, either ensure the payload's intended output is the actual last line, or capture via a different mechanism (redirect to a readable file) if multi-line output is needed."
  - "A file with no trailing newline can end up concatenated with subsequent error/output text on what exec() treats as a single 'line' -- verify how the target data's exact byte content interacts with the injection technique."
