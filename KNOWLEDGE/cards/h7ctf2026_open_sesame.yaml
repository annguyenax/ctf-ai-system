signals:
  - "Raw complex-baseband (cf32) capture of 8 OOK (on-off-keyed) remote-control button presses, each advertised as producing a fresh \"unguessable\" code."
  - "A live /unlock endpoint accepts a 12-hex-digit (48-bit) code and is expecting the 9th press."
key_idea: "\"Unguessable\" per-press codes in cheap remotes are frequently just a monotonic counter plus a short-period checksum, not real randomness. Envelope-threshold the raw IQ magnitude to get a binary PWM bitstream (distinguish short/long high-pulse widths as bit 0/1, long low gaps as inter-press separators), decode all captured frames into their bit columns, then diff successive frames column-by-column: a fixed serial number stays constant, a counter field increments by a constant step, and any remaining low bits cycle with a short period (checksum). Predict the next frame by extrapolating the counter and brute-forcing only the small checksum/low-bit region, rather than the whole 48-bit space."
prerequisites:
  - "Basic OOK/PWM envelope demodulation from raw IQ (abs(), threshold, run-length encode)"
  - "Column-wise diffing across multiple decoded frames to separate fixed/incrementing/cyclic fields"
exploitation_pattern: "envelope-threshold cf32 capture -> run-length encode high/low pulses as PWM bit 0/1 with gap-based frame separation -> decode 8 frames to bits -> diff columns across frames to classify fixed/counter/checksum regions -> predict counter for 9th press -> brute only the small checksum region for each candidate -> POST each candidate code to /unlock until accepted."
verification:
  method: "Live replay against the service; a predicted+brute-forced 9th code was accepted, returning {\"status\":\"unlocked\", flag:...}."
