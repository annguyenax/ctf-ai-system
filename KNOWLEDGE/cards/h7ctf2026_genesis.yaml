signals:
  - "An ERC4626-style vault tracks assets with an INTERNAL storage counter rather than token.balanceOf(address(this)), but also exposes a sync() function that copies the real token balance into that internal counter."
  - "deposit() computes shares via the naive unprotected formula assets*totalSupply/totalAssets with no require(shares > 0) guard and no virtual-offset protection (no OpenZeppelin-style decimals offset)."
key_idea: "The classic first-depositor/share-inflation attack on a vault normally requires the vault to read its real token balance directly; if it instead uses internal accounting specifically to resist a raw donation, check for any public function (often named sync(), skim(), or similar DEX-style helper) that lets you force the internal counter to match an inflated real balance. Front-run the victim's large deposit by minting 1 share cheaply, donating a large raw token transfer to the vault, calling sync() to inflate totalAssets, then letting the victim's deposit round down to 0 shares under the now-inflated share price -- you keep 100% of the pooled assets (yours + the victim's) for your single share."
prerequisites:
  - "Direct contract calls (web3.py/eth_abi) against a chain with ERC20 approve/transfer and vault deposit/sync functions"
  - "Understanding ERC4626 share-price math and its first-depositor inflation weakness"
exploitation_pattern: "approve vault for your token -> deposit(1) to mint 1 share (totalSupply=1, totalAssets=1) -> token.transfer(vault, large_amount) raw donation -> vault.sync() sets totalAssets = real balance (huge) -> trigger/await the victim's large deposit, whose shares = assets*1/huge rounds to 0 -> victim holds 0 shares for their stake; you hold the only share, now worth the entire pooled total."
