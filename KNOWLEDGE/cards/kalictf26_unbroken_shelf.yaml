key_idea: |
  Định danh số báo lịch sử bằng full-text search cụm TIÊU ĐỀ CHÍNH XÁC trên
  Chronicling America (LOC). Cụm "Blows Firemen Out of Drug Store" khớp DUY NHẤT
  New-York Tribune 1920-08-21 p.1 (LCCN sn83030214). Đọc toàn văn OCR để lấy
  địa chỉ (157 Eighth Avenue) và giờ (about 8:40 p.m. -> 2040).
prerequisites:
  - "Chronicling America full-text search (cụm chính xác)"
  - "hiểu ALTO XML / fo=json -> fulltext_service -> tile.loc.gov"
exploitation_pattern: |
  1) Trích cụm chữ độc nhất (tiêu đề) từ ảnh.
  2) Search toàn văn cụm chính xác -> 1 số báo.
  3) Đối chiếu thân bài để xác nhận đúng trang.
  4) Đọc OCR nguồn cấp một -> số nhà + giờ; đổi am/pm sang 24h.
