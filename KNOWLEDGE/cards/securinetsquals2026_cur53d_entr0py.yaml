pitfalls:
  - "A binwalk file-type hit for an embedded image (e.g. PNG+zlib) inside a packed binary is not automatically a hidden/smuggled payload -- cross-check its file offset/size against the PE's own resource directory entry (.rsrc) before concluding it's packer-injected content; it may simply be the application's normal icon resource."
