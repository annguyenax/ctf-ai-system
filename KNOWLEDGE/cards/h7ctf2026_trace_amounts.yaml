signals:
  - "500 known plaintexts paired with 500 power-consumption traces (700 samples each) from a contactless card doing AES-128, plus a ciphertext sealed under the same key."
key_idea: "Classic Correlation Power Analysis (CPA): for each of the 16 AES-128 key bytes independently, hypothesize all 256 candidate values, compute a Hamming-weight leakage model on the AES round-1 SBox output (HW(SBox(plaintext_byte XOR key_byte_candidate))) for every trace, and compute the Pearson correlation between that hypothesis vector and the actual power trace at every time sample; the candidate value producing the highest peak correlation (across all time samples) is the correct key byte. Recombine all 16 recovered bytes into the full key and decrypt the sealed ciphertext with standard AES-128-ECB/CBC."
prerequisites:
  - "numpy for correlation computation across (256 candidates) x (700 time samples) x (500 traces)"
  - "AES SBox table"
exploitation_pattern: "for each key byte position: compute HW leakage model per candidate per trace -> Pearson-correlate against trace matrix across all time samples -> pick candidate with highest peak correlation -> repeat for all 16 bytes -> assemble full AES key -> AES-decrypt the sealed secret with PKCS7 unpadding."
verification:
  method: "Deterministic CPA recovered all 16 key bytes with peak correlations ~0.65-0.72, and the resulting key correctly decrypted the sealed ciphertext to a well-formed flag."
