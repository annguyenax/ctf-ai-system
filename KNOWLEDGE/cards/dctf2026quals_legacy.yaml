pitfalls:
  - "Loading a secret into a variable that is never printed/used is NOT safe if the process can be made to crash/core-dump while the secret is still live in memory -- a coredump written with permissive permissions is itself a leak."
  - "No 'strings' binary on the target box; carving secrets out of a raw core dump requires knowing the interpreter's internal object header layout (here CPython2's str type pointer + size field) to locate candidate strings directly."
