  - AES key = sha256(bytes(secret_signature)); need exact preimage
key_idea: >
  Raw Oil-and-Vinegar central map. Fixing the 4 vinegar vars makes every equation
  linear in the 4 oil vars. Brute vinegar (79^4, numpy-vectorized batched modular
  Gauss), solve 4 eqns for oil, verify the other 5. M>N => unique consistent point
  = secret signature -> AES key -> flag.
prerequisites:
