signals:
  - "The size-check compares only the low 16 bits of a 64-bit size returned by strtoull (cmp ax, 0x60) while read(0, buf, size) uses the full 64-bit value, so size=0x10040 (65600) passes the 16-bit check (low word 0x40) but overflows a 96-byte stack buffer massively."
  - "Saved r12 on the stack holds a menu-string pointer (PIE+0x2101) that is printed every loop iteration via puts(r12); a 2-byte partial overwrite of saved r12 can redirect that puts() to an arbitrary low-16-bit offset from the current PIE base, acting as an info leak -- but only succeeds when the low 16 bits of the real PIE base happen to be 0x0000 (~1/16 chance under ASLR), otherwise it crashes and must be retried on a fresh connection."
  - "No seccomp filter is ever installed in this run (the option that installs it is never exercised), so open/read/write/execve all remain available for a classic ORW chain once libc is leaked."
key_idea: "A 16-bit truncated bounds check next to a 64-bit read() size enables a large stack overflow despite a seemingly tight check. Chain: (1) partial-overwrite saved r12 to redirect the menu's own puts() at an .init_array relocation entry, leaking PIE base (probabilistic, retry-on-failure); (2) with PIE known, classic puts(GOT.puts) ROP leaks libc; (3) ORW chain via binary PLT + libc pop-rdx gadget reads /flag.txt. No canary, Full RELRO+NX+PIE otherwise standard."
prerequisites:
  - "x86-64 ROP chain construction (pwntools-style)"
  - "Stack-frame-offset reasoning from disassembly to locate saved r12 relative to the overflowed buffer"
  - "Patience/retry logic for a probabilistic (~6.25% success) leak primitive across repeated connections"
exploitation_pattern: "16-bit truncated size check + 64-bit read -> large stack overflow -> probabilistic 2-byte partial overwrite of a register holding a printed pointer, retried until it lands page-aligned -> PIE leak -> classic GOT leak for libc -> ORW ROP chain reading the flag file (no seccomp installed in this path)."
