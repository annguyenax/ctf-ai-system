pitfalls:
  - "A size check that uses a narrower register/comparison (cmp ax, ...) than the actual value passed to a syscall (64-bit r12) is a classic truncation bypass -- always check the exact register width used in bounds comparisons versus the width used in the subsequent syscall argument."
  - "A probabilistic partial-overwrite leak primitive requires detecting and handling failure (crash) by reconnecting on a fresh ASLR roll, not treating a single failed attempt as a dead end."
  - "The flag captured ('PTITCTF{local_test_flag}') is from local Docker replay, not a confirmed live-instance capture -- the original remote instance had expired; renewing and rerunning solve_remote.py would be needed for a genuine remote-verified flag."
