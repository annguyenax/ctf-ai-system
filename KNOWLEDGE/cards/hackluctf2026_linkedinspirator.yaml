signals:
  - "A silently-caught `ValueError` from `unpad()` on invalid PKCS#7 padding vs. a printed error on valid padding is a classic CBC padding oracle, giving full block decryption via ~16*256 queries per block."
  - "The server checks an ECB-decrypted 'auth_tag' against `xor_blocks(plaintext)`, but there is no encryption oracle -- only decryption -- so the tag must be fixed first and the required plaintext constructed backward via CBC-R."
  - "Latin-1 `.strip()` removes exactly 12 whitespace byte values, all of which share bit 0x40==0; since the required plaintext core's hex-digest-derived bytes also have bit 0x40 encoding hex-letter-vs-digit, you can brute-force a username whose SHA-256 hex digest makes `xor_blocks(core) XOR target` land entirely inside the whitespace lookup table, letting 4 whitespace-padding blocks absorb the XOR difference."
key_idea: "Combine a CBC padding oracle (full block-decryption primitive) with CBC-R backward chaining to forge a multi-block plaintext that both matches a required textual template after `.strip()` and satisfies an ECB-decrypted XOR-tag check, by searching offline for a username whose SHA-256 digest makes the required XOR difference entirely expressible as latin-1 whitespace bytes."
prerequisites:
  - "CBC padding oracle mechanics"
  - "CBC-R (backward/Vaudenay) forgery construction"
  - "latin-1 .strip() whitespace byte-value awareness"
exploitation_pattern: "padding-oracle block decryption -> recover ECB-tag's AES-ECB-decrypted value -> offline search for a username whose digest makes the needed XOR-blocks difference land in a precomputed whitespace-byte lookup table -> CBC-R backward-construct the full ciphertext -> pipeline the 256-candidate-per-byte oracle queries over one TLS connection to cut wall-clock time."
