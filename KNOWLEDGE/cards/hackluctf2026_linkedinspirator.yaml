pitfalls:
  - "Only a decryption oracle is available (no direct encryption) -- a tag/MAC check against an ECB-decrypted value must be solved by fixing the ciphertext first and using CBC-R to build matching plaintext backward, not by trying to encrypt forward."
  - "`.strip()` under latin-1 removes a specific 12-byte whitespace set; when you need several trailing blocks to vanish after strip while still contributing to an XOR/checksum, precompute a k-block whitespace-combination lookup table keyed by XOR value rather than searching byte-by-byte."
  - "A padding-oracle attack with up to tens of thousands of queries at ~1s/request is impractical sequentially -- batch all 256 candidates for a byte into one pipelined burst over a single persistent connection and distinguish responses by substring, not by exact text match (to avoid false positives from similarly-worded messages)."
