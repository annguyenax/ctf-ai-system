key_idea: >
  Keyboard shift cipher. Right hand typed one key to the right on QWERTY; decode
  by mapping each right-hand key to the key one column to its LEFT on the same
  physical row, preserving shift state. Left hand / digits 1-5 / space unchanged.
prerequisites:
  - qwerty-layout
  - substitution-cipher
exploitation_pattern: detect adjacent-key typos -> build QWERTY shift map (both shift layers) -> apply -> read plaintext + flag
