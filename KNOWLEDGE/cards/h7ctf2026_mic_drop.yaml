key_idea: "When a challenge presents a live streamed feed (HLS/RTSP/etc.) rather than a static file, first find and download the manifest + segments (brute-forcing likely directory names if undocumented), reassemble to a single audio file with ffmpeg, then inspect a spectrogram for an anomalous tone-burst region; two tone bands at roughly 1200/2200 Hz are the classic Bell-202 AFSK modem tones -- measure the minimum symbol run-length to get the true baud rate (don't assume the nominal 1200 baud), demodulate with simple quadrature correlators per symbol window, then frame as UART 8N1 LSB-first to recover ASCII."
prerequisites:
  - "ffmpeg for HLS reassembly"
  - "numpy/scipy for spectrogram + simple FSK demod"
exploitation_pattern: "brute-force/discover the hidden stream path -> download m3u8+segments -> ffmpeg reassemble to WAV -> spectrogram to locate the tone burst -> measure run-length to get actual baud (symbols/sample count) -> non-coherent FSK demod per symbol window -> UART 8N1 LSB-first framing -> ASCII flag."
