pitfalls:
  - "Checking only seccomp_data.nr without seccomp_data.arch in a BPF filter makes syscall number allow-lists meaningless: the attacker chooses which ABI (hence which actual syscall) a given number resolves to."
  - "setcontext-based gadgets in glibc are not usable directly under a tight seccomp filter if the full function prologue issues a disallowed syscall (here rt_sigprocmask) before reaching the useful register-load half -- jump into the function body past the disallowed prologue instead of calling it from the start."
  - "A read-only syscall primitive (no write/send mapped) still has no direct exfil path; a crash-vs-hang side channel per remote connection is the fallback, but is a large, multi-stage construction (large effort, 'insane' difficulty by design)."
failed_paths:
  - "Calling glibc's setcontext from its normal entry point triggers rt_sigprocmask (a disallowed syscall) before reaching the useful register-restore code, immediately killing the process under the seccomp filter."
  - "No clean 'mov rsp,[rdi+X]; ret' stack-pivot gadget was found in the provided libc for this bit-flip-sized corruption target; only jmp-based or register-dependent pivots were available, none fully resolved."
