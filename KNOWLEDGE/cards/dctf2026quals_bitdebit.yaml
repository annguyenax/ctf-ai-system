time_heuristic: "Whenever a seccomp-bpf filter is reverse engineered, explicitly check whether it loads and compares seccomp_data.arch in addition to .nr -- if arch is unchecked, every allowed syscall number is actually TWO allowed syscalls (one per x86 ABI), which can turn a narrow allow-list into a usable read (or worse) primitive."
