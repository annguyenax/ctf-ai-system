time_heuristic: "Any stateful one-time-signature scheme (WOTS/LMS/XMSS) that exposes a counter-reset/rollback operation breaks its core one-time guarantee; harvest several signatures on the reused leaf first to build a per-position minimum-digit profile, then search for a forgeable message rather than trying to invert the hash chains directly."
