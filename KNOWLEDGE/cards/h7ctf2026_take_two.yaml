signals:
  - "Service implements LMS/WOTS stateful hash-based signatures (Merkle tree of Winternitz OTS leaves) and exposes a /rollback endpoint that resets the leaf counter to 0."
  - "WOTS security depends on each leaf key being used exactly once; rollback lets you re-sign arbitrary messages with the SAME leaf repeatedly."
key_idea: "WOTS hash chains are one-way (you can advance H^a(sk) forward to H^b(sk) for b>=a but never backward); if a stateful WOTS/LMS leaf counter can be rolled back, request many signatures on benign messages under the same leaf, track the minimum digit value observed at each of the 67 chain positions, then search for a target message (e.g. with an embedded nonce) whose own digits are all >= those minima -- advance each hash chain forward by the small remaining distance to forge a valid signature for an arbitrary message using that reused leaf."
prerequisites:
  - "Understanding of Winternitz OTS digit/checksum encoding and chain direction"
  - "Ability to request several signatures on the exploited leaf before the rollback is disallowed"
exploitation_pattern: "call /rollback + /sign repeatedly on leaf 0 with benign messages -> record per-position minimum digit -> brute a nonce in the target malicious message so all its digits are >= the recorded minima -> advance each WOTS chain by (target_digit - min_digit) hashes from the stored minimal signature -> submit forged WOTS signature + known Merkle auth path -> verifies against the public root."
verification:
