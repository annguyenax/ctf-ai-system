time_heuristic: "When an L2 contract's owner check expects an L1 contract's address but the only path into L2 is via a bridge that aliases the sender address, check for a deterministic deployer (CREATE2/CREATE1 with known nonce) that lets you redeploy the SAME bytecode directly on L2 at the exact address the check expects, instead of fighting the aliasing in the relay path."
