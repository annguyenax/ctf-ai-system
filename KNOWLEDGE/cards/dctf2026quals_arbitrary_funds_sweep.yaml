signals:
  - "A Vault contract on L2 is owned by an L1 contract address (Saylor), but the L1->L2 relayer rewrites the caller address by adding a fixed offset (+0x1111...1111), i.e. standard L2 address aliasing for cross-chain messages."
  - "Calling Saylor.relay -> L2 execute() reverts 'not the owner' because the aliased address never equals the real L1 Saylor address recorded as vault.owner."
  - "An identical CREATE2 factory exists on both L1 and L2 with a deterministic address formula (salt + bytecode)."
key_idea: "Instead of relaying through the (aliased, mismatched) bridge path, redeploy the exact same owner contract bytecode and salt directly on L2 via CREATE2 so the resulting contract address matches vault.owner exactly; then call the vault's execute() directly on L2 through that redeployed contract, bypassing the cross-chain aliasing mismatch entirely."
prerequisites:
  - "Understanding of L2 bridge address aliasing (sender address + fixed offset, e.g. Arbitrum's 0x1111...1111 alias offset)"
  - "CREATE2 deterministic deployment (address = f(deployer, salt, init code hash))"
exploitation_pattern: "owner address check expects the UNALIASED L1 contract's address on L2, but the relay path always arrives aliased -> deploy the same bytecode+salt via CREATE2 directly on L2 so the deployed contract's address equals the expected (unaliased) owner address -> call vault.execute() from that contract on L2 directly, no bridge/relay needed."
verification:
  method: "On-chain action: CREATE2-deployed contract issued the vault's execute() drawing 5 ETH to the player address, vault balance went 5 ETH -> 0, and the challenge's GET /flag endpoint returned the flag."
