pitfalls:
  - "Waiting on or trying to fix the aliased cross-chain retryable-ticket relay path is a dead end here -- the aliasing offset is fundamental to the bridge and cannot be bypassed by retrying; the owner check must be satisfied directly on the target chain instead."
failed_paths:
  - "Relaying through Saylor.relay to L2 execute() always reverts 'not the owner' because the bridge-aliased caller address never matches the unaliased owner address recorded on the vault."
