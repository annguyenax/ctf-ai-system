signals:
  - "Program loops calling printf(user_input) directly -- a classic uncontrolled format-string vulnerability, repeated across multiple iterations."
  - "The target binary ships NO win()/system()-calling convenience function and does not leak libc automatically -- both libc and PIE bases must be derived purely via %N$p format leaks at specific positional argument indices."
  - "Because printf is called on raw user input EVERY iteration, overwriting printf's own GOT entry with system() makes the VERY NEXT loop iteration's printf(buf) call become system(buf) for free."
key_idea: "When a format-string bug is inside a loop that calls printf(buf) on freshly-read user input every iteration, overwriting printf's GOT entry with system (via a crafted fmtstr_payload on one iteration) converts the next iteration's identical printf(buf) call into system(buf) automatically -- no separate ROP/return-oriented step needed to reach code execution."
prerequisites:
  - "Positional format-string argument leaking (%N$p) to find the exact stack-argument indices holding a known caller's return address and the main() address"
  - "pwntools fmtstr_payload for a GOT write at a known offset"
exploitation_pattern: "leak %43$p (a return address into __libc_start_main) and %47$p (&main) in one line -> compute libc_base and pie_base from known fixed offsets -> compute system = libc_base + offset and printf_got = pie_base + offset -> send fmtstr_payload(8, {printf_got: system}) on the next loop iteration -> send '/bin/sh' on the following iteration, which now runs as system('/bin/sh') because printf@GOT was overwritten"
