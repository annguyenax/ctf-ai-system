pitfalls:
  - "When a challenge's own description implies a specific repeated primitive ('two flips', 'doppel-') rather than one-off exploitation, look for the exact sequencing/ordering dependency between the repeated applications (e.g. corrupting state used by a SECOND already-scheduled operation) rather than treating each application independently."
failed_paths:
  - "Docker Desktop's Linux engine was unavailable in this environment, preventing faithful local reproduction of the exact ASLR/libc behavior needed to validate the PIE-base-dependent write target."
