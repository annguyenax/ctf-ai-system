signals:
  - "Custom TLS curve has cofactor 2^16, so the low 16 bits of the ECDHE scalar are recoverable via Pohlig-Hellman in the 2-torsion subgroup from the public point alone."
  - "Each TLS handshake leaks 16 bits of a persistent server-side Ruby MT19937 generator; ~1248 consecutive handshakes on one connection gives 19968 bits, enough to solve the full 19937-bit MT19937 state via GF(2) Gaussian elimination."
  - "Node vm.createContext() omits `crypto` from the sandbox, so snarkjs's getRandomBytes() and a uuid library both silently fall back to Math.random()."
  - "V8 Math.random() batches 64 XorShift128 outputs per refill and pops them in LIFO order; tracing exact call counts (uuid buffer fill then PLONK seed) lets you align UUID bytes to forward XorShift128 state and the seed bytes to a different offset in the same 128-bit linear generator."
key_idea: "Chain two independent weak-PRNG breaks: (1) recover a Mersenne Twister's full internal state from torsion-subgroup-leaked low bits of each TLS ECDHE scalar to decrypt captured traffic, then (2) recover the V8 Math.random() 128-bit XorShift state from a UUID's bytes (via a GF(2) linear system, 2^6 candidate states) to predict the ZK-proof blinding factors and brute-force the committed vote per ballot."
prerequisites:
  - "Pohlig-Hellman over small prime-power subgroups"
  - "GF(2) linear algebra for LCG/MT/xorshift state recovery"
  - "Node vm sandbox semantics (missing globals fall back silently)"
  - "PLONK wire polynomial blinding structure"
exploitation_pattern: "small-order curve subgroup leak -> MT19937 state recovery -> TLS session key -> decrypt HTTP response -> per-ballot UUID leaks sandboxed Math.random() state -> predict ZK blinding -> brute-force 3 candidate votes against eval_a."
