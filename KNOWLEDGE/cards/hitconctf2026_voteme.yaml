pitfalls:
  - "A curve with a large smooth cofactor leaks low bits of any scalar multiplication's exponent for free -- always factor the curve order before assuming ECDH/ECDSA scalars are opaque."
  - "Any JS sandbox (vm.createContext, isolated-vm, etc.) that omits `crypto` silently downgrades every library relying on it to Math.random() rather than erroring -- a correctness bug becomes a cryptographic break."
  - "V8's Math.random() entropy pool is LIFO; naive 'count calls forward' reasoning gives the wrong byte order unless you account for the pop order explicitly."
