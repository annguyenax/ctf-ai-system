signals:
  - "Java-level license-key validation only checks that the field is non-empty; the real check is entirely in native code (libOctopus.so), so Java-layer static/dynamic analysis alone misses the actual gate."
  - "The native check compares the key's length to exactly 5 and its first 4 bytes to a fixed 32-bit immediate ('hell'), then the 5th byte to 'o' via a conditional compare (ccmp) -- the master key is simply the literal string 'hello'."
  - "A visually plausible 30-character alphanumeric string sitting in .rodata next to JSON-library noise is a decoy: it is the response-decryption XOR key (cryptor_static_base::m_key), not the license key."
key_idea: "Native Android license checks hide the real comparison in ARM64 native code (JNI) while the Java layer only enforces a trivial non-empty constraint; the actual validation constant must be read directly from the disassembled native function (here: a 5-character literal compared via length check + 4-byte immediate + single-byte ccmp). A long, random-looking string elsewhere in .rodata that appears to be a license/key is frequently a decoy serving an unrelated purpose (here, decrypting the app's own network response payloads)."
prerequisites:
  - "APK extraction and native .so disassembly (ARM64)"
  - "JNI method registration tracing (JNI_OnLoad) to map the exported native symbol to its real implementation address"
  - "Basic hash computation (MD5) per the flag-format instruction"
exploitation_pattern: "Java layer only checks non-empty -> trace JNI_OnLoad to find the real native validation function -> read the fixed-length + byte-immediate comparison directly from ARM64 disassembly -> recover the literal master key -> hash as instructed by the flag format."
verification:
  method: "Independent ARM64 disassembly confirms the exact length check (#5), 4-byte movk-built immediate (0x6c6c6568 = 'hell'), and ccmp (#0x6f = 'o') at the native function entry; Python hashlib.md5(b'hello') matches the submitted flag."
  evidence: "D:/download/ctf-ai-system/OUTPUT/_archive/PTITCTF2026/Reverse/PhoneFarm/notes/SESSION.md documents the exact ARM64 instruction sequence at 0x147a0 in libOctopus.so and the MD5 computation."
pitfalls:
