pitfalls:
  - "Do not try to brute-force the full 64-bit seed directly; exploit the GF(2) linearity instead (8 queries is enough for 64 bits of leak at 8 bits/query)."
  - "The 24-bit nonce truncation is what makes a 2^24 brute-force search for a matching x tractable; a fast C/compiled search helps (50M steps in ~0.02s here) but a tight Python loop may also suffice depending on time budget."
