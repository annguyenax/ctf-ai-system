signals:
  - "Server state transition is an xorshift64-style PRNG: pure XOR/shift ops, strictly linear over GF(2)."
  - "A 'jump table' / matrix-doubling function computes state_at(x, seed) == T^x(seed) in O(64) steps, and is itself linear in seed for fixed x."
  - "Oracle leaks only the low 8 bits of state_at(x, seed) per query (via a truncated nonce byte), but each leak gives 8 linear equations over GF(2) in the unknown seed."
  - "Nonce is only 24 bits of the 64-bit internal state -> a ChaCha20 nonce/key reuse (two-time pad) is reachable by brute-forcing x in a 2^24 search once the state generator is fully known."
key_idea: "When a server state machine is built from xorshift-style XOR/shift/rotate operations only (no addition/multiplication), the entire transition is linear over GF(2); any oracle that leaks even a few bits per query, repeated with queries at x=2^k, yields enough independent linear equations to solve for the full internal secret via Gaussian elimination over GF(2), after which the generator can be run forward/backward freely."
prerequisites:
  - "GF(2) linear algebra / Gaussian elimination"
  - "Matrix-doubling 'jump ahead' trick for linear recurrences (xorshift jump table)"
  - "Stream cipher two-time-pad flag recovery once nonce/key reuse is achieved"
exploitation_pattern: "identify xorshift-only transition -> build GF(2) jump matrices for x=2^k -> query oracle at x=0,1,2,4,...,64 collecting 8-bit leaks -> solve 64x64 GF(2) system for seed -> brute-force x in 2^24 space to reproduce the flag's nonce suffix -> request encryption of a zero-plaintext at that x to get the keystream -> XOR with flag ciphertext"
