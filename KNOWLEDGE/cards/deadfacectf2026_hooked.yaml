  - Provided zip contains an imaged Chrome profile directory (`User Data/Default/History`), which is a SQLite database.
  - Challenge gives an approximate time window (10:23 AM) to anchor the search instead of requiring full-browser-history replay.
  - "Chrome stores `last_visit_time` as microseconds since 1601-01-01 UTC (Windows/Chrome epoch), not Unix epoch."
key_idea: To find a specific browsing event in a Chrome profile image, open the `History` SQLite file directly and query the `urls` table ordered by `last_visit_time`, converting the Chrome/WebKit timestamp (microseconds since 1601-01-01) to a normal datetime to correlate with the stated time window.
prerequisites:
  - sqlite3 access to the raw `History` file (no running Chrome needed)
  - Knowing the Chrome epoch offset: 11644473600000000 microseconds between 1601-01-01 and 1970-01-01
exploitation_pattern: sqlite3.connect('History') -> SELECT url, title, last_visit_time FROM urls ORDER BY last_visit_time -> convert timestamp(s) around the target time -> identify the suspicious/phishing URL visited right before/after a legitimate-looking email open.
