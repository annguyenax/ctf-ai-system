pitfalls:
  - "For a live multi-stage quiz/verifier service, build a replay mechanism from the start that resubmits every already-accepted answer against each fresh instance; an expired/reset instance is not a rejected answer and should not be treated as invalidating prior progress."
  - "Passing several questions in a staged live-quiz challenge is partial progress, not a solved challenge; do not conflate 'service advanced to next question' with 'flag recovered'."
  - "Do not guess at list-based or enumerable answers (e.g. player name permutations) without an evidence basis; search the relevant platform/organization's own public records (certificate transparency, public repos, agendas) directly instead."
