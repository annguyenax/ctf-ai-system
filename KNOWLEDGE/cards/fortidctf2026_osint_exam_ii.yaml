signals:
  - "A live multi-question quiz service accepts one answer at a time and only reveals the next question after an accepted answer, so progress must be tracked and replayed stage by stage."
  - "Each question is solvable via a different class of public-record source: official race-result timing pages, conference-agenda session listings, and a school's public exam-report PDF plus a YouTube video description."
  - "Public-record identity linking (LinkedIn directory + school report + YouTube video metadata) successfully resolved an individual's identity across three independent sources for one question."
key_idea: "Multi-stage live-quiz OSINT challenges require replaying already-accepted answers to reach the current unanswered question on any fresh instance; three of four questions were solved via official public-record sources (race timing results, conference agenda, school exam report + video metadata cross-reference), but the fourth question depends on an internal scoreboard/leaderboard link that has not yet been located via public searches of the referenced organization's GitHub and web presence."
prerequisites:
  - A replay script that resubmits all previously-accepted answers in order against a freshly-started instance before attempting the next unanswered question
  - Cross-referencing multiple independent public-record source types (sports timing results, conference agendas, school/exam reports, video platform search, LinkedIn directories) for identity resolution
exploitation_pattern: "(partially resolved) sequential live-quiz questions, each answered from a distinct public-record source class, replayed against each new instance via a saved accepted-answers list; final question blocked on locating an internal/organizational scoreboard link"
