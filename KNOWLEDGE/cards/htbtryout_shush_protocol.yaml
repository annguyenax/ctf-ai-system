key_idea: "Modbus function codes >= 65 (0x41) are reserved for vendor-specific/custom protocol extensions; when a pcap shows mostly standard-function noise traffic plus one stream using an out-of-range function code, that stream is the intended 'custom protocol' channel and is worth inspecting byte-for-byte for plaintext secrets."
prerequisites:
  - Manual or scripted pcap + Modbus/TCP ADU parsing (Transaction ID, Protocol ID, Length, Unit ID, Function code, data)
exploitation_pattern: "filter pcap to port 502 -> parse Modbus ADU function codes -> flag the one stream using a vendor-reserved function code (>=0x41) -> read its payload directly"
