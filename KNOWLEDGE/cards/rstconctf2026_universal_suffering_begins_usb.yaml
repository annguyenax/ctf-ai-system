signals:
  - pcap with LinkType 288 (raw USB link-layer/physical packets), several devices on one hub (printer, mass-storage flash drive, HID).
  - Mass-storage device exchanges SCSI Bulk-Only Transport commands (CBW/CSW) with `Write(10)` (0x2a) carrying LBA/sector-count metadata.
key_idea: At USB link-layer capture granularity, a file write shows up as separate OUT token packets (announcing device/endpoint), DATA0/DATA1 packets (payload), and the host's ACK/NYET handshake that confirms acceptance. Track the last (device, endpoint) seen on an OUT token, buffer the following DATA packet, and only commit it to the reconstructed stream once an ACK/NYET is observed (NAK/STALL means retry — discard the pending buffer). Locate the SCSI CBW signature (`USBC` + little-endian tag) in the reassembled stream to find file-part offsets, then concatenate the parts and trim to a known file magic/trailer (e.g. PNG `IEND` chunk) to recover the embedded file.
prerequisites:
  - Understanding of USB Bulk-Only Transport (CBW tag, LBA, sector count) and USB PID bytes (OUT=0xe1, DATA0/1=0xc3/0x4b, ACK=0xd2, NYET=0x96, NAK=0x5a, STALL=0x1e)
  - Manual pcapng record parsing (gzip + raw record struct unpack) when scapy/tshark USB dissection is insufficient for a given link-layer encoding
exploitation_pattern: parse raw pcapng records -> track last OUT token's (device, endpoint) -> buffer next DATA packet -> commit to stream only on ACK/NYET, discard on NAK/STALL -> locate CBW tag signatures to find file byte offsets -> concatenate parts -> trim by file magic/trailer -> extract embedded file -> read flag from its content (visually, here inside image dialogue bubbles).
verification:
  method: Deterministic extraction of an exact PNG (confirmed by `IEND` trailer) from reconstructed SCSI write payloads; flag text visible inside the extracted image was then read.
  evidence: "D:/download/CTFTimeWriteup/RSTCONCTF2026/Forensic/Universal_Suffering_Begins__USB_/solve/solve.py"
pitfalls:
  - The decoy printer device (IPP over USB) prints documents containing a fake "Lack of rstcon{} flag lmao" string — don't trust the first flag-shaped string found; confirm which device/endpoint is the real data channel (the mass-storage device).
  - Readily-available high-level USB dissectors may not expose raw DATA/ACK sequencing cleanly for this capture; manual byte-level pcapng parsing of PIDs was required.
