key_idea: "Emptying __builtins__ in the eval globals dict does not remove the real builtins from already-loaded objects' __globals__ -- walk the live class hierarchy from any literal (e.g. ().__class__.__base__.__subclasses__()) to find a standard-library class whose __init__.__globals__['__builtins__'] still holds the real builtins dict, then index into it with string-concatenation-built keys (e.g. 'op'+'en') to dodge a naive substring keyword blocklist, and build blocked path strings (e.g. '/fl'+'ag.txt') the same way."
prerequisites:
