flag: "bushbashctf{n0w_d0_t5e_oth4r_tw0}"
service: "34.40.133.67:6767"
key_idea: >
  Rust client binary (full DWARF) generates prost-protobuf messages for a custom
  TCP protocol. CLI's "readflag" subcommand is a deliberate unimplemented stub;
  solver must hand-craft the wire bytes for that oneof variant (field 4, empty
  ReadFlag). Server rejects fields encoded in canonical/default form (explicit
  empty submessage / explicit-zero varint) as "Bad encoding error" - an
  anti-tampering check assuming a well-behaved encoder would omit defaults.
  Padding the field with non-empty junk content bypasses the check and returns
  the flag. Response text confirms a chained "mystery server II", most likely
  entered via the CLI-unexposed field 5 (ReadMultipleMessages).
prerequisites:
  - readelf --debug-dump=info (DWARF struct/enum recovery)
  - objdump -d reading prost encode_raw / oneof dispatch immediates as field tags
  - raw TCP socket scripting (python) for live protocol probing
exploitation_pattern: >
  DWARF struct recovery -> disassemble encode_raw/dispatch for field tags ->
  replay client's own generated bytes at live server to confirm framing ->
  hand-craft the CLI-unimplemented oneof variant -> if rejected as "default
  encoding", pad with non-empty junk content to bypass canonicalization check
pitfalls:
  - assuming nc/printf hex escapes work reliably over a remote shell (use python
    socket + bytes([...]) instead)
  - assuming "Bad encoding error" means the field/endpoint is blocked, when it
    actually means "this looks like an omitted/default field, not malformed data"
  - missing that an index=0 explicit-zero varint hits the same rejection rule as
    the empty ReadFlag - a good cross-check to confirm the general rule before
    committing to the junk-padding fix
tools:
  - readelf
  - objdump
  - nm
  - checksec
  - python socket
playbook: PLAYBOOKS/rev_protobuf_wire_dwarf.md
