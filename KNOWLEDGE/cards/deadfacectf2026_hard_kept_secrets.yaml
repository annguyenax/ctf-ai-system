signals:
  - APK's Dalvik bytecode (classes.dex) constructs an OkHttp interceptor with a hardcoded internal API token string literal.
  - Standard tooling (androguard) may not be installed/available; the DEX string pool format is simple enough to parse by hand.
key_idea: "When you cannot or do not want to rely on androguard/jadx, a hardcoded secret in a DEX file can be recovered directly from the DEX string table: read string_ids_size/off from the header (offsets 0x38/0x3C), walk each string_id to a ULEB128-prefixed MUTF-8 string, and regex/substring match for the known partial value."
prerequisites:
  - Knowing the DEX header field offsets for string_ids_size and string_ids_off
  - A partial fragment of the expected secret to filter the string pool
exploitation_pattern: unzip app-release.apk -> read classes.dex bytes -> parse string_ids table -> decode each string (skip ULEB128 length prefix) -> filter candidates containing a known fragment of the token -> confirm against API usage (auth header name).
