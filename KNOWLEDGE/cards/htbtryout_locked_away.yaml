pitfalls:
  - "Substring blacklists on exec()/eval() input are fundamentally bypassable: any forbidden token can be reconstructed from allowed primitives (chr/ord, string concatenation) and any forbidden syntax (brackets, quotes) usually has an equivalent method call (dict.get, getattr) that isn't blocked."
  - "Real defenses need an AST-based allowlist or a sandboxed restricted execution environment, not substring filtering."
