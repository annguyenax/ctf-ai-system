signals:
  - "A Python jail blocks input containing any of a list of forbidden substrings (import, open, [, ], quotes, etc.) before calling exec(command)."
  - "exec() runs with the module's own globals() dict, which already contains the target function (open_chest) the challenge wants reached."
  - "The blacklist blocks bracket indexing and all quote characters, so no literal string and no dict/list subscript syntax is directly usable."
key_idea: "Build the target function's name at runtime from chr(ord) codes (avoiding any literal string containing a blocked substring), then retrieve it from globals() using dict.get(name) instead of globals()[name] to avoid the blocked bracket characters, and call the result -- bypassing a substring blacklist that filtered quotes, brackets, and the literal function/keyword names."
prerequisites:
  - exec()/eval() running with access to globals() containing a sensitive function
  - A blacklist based on substring matching rather than an AST/token whitelist
exploitation_pattern: "chr(ord)-constructed name string (no quotes) + globals().get(name)() (no brackets) -> calls sensitive function while containing none of the blacklisted substrings"
