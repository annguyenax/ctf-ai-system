key_idea: "Scan BLE captures for any GATT read/notification whose payload is plaintext firmware debug output describing the crypto scheme (handle offsets, key source, keystream construction) -- this is a very common CTF pattern (the firmware \"helpfully\" documents itself). Then simply follow the recipe: extract the provisioning key from advertising manufacturer-specific data (after the company-ID + type bytes), XOR-decrypt a cyclic-XOR-protected handle directly, and for a second \"vault\" handle derive a SHA-256-based keystream from provkey||nonce||counter (nonce pulled from a notification) and XOR it against the ciphertext."
prerequisites:
  - "Raw pcap/BLE link-layer packet parsing (or pyshark/scapy BLE dissectors)"
  - "Locating manufacturer-specific AD structures by company ID"
exploitation_pattern: "parse pcap packets -> find debug GATT read response describing the scheme -> extract provkey from advertising manufacturer data -> XOR-decode cyclic-key handle directly -> for SHA256-keystream handle, pull nonce from its notification, generate keystream blocks SHA256(provkey||nonce||i) for i=0,1,.. concatenated, XOR against ciphertext."
