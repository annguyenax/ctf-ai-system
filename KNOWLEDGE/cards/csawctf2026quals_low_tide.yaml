signals:
  - "Two hosts: a decoy static login page (broken on purpose) and a separate real backend (Flask/gunicorn) referenced via obfuscated frontend JS (ROT47-encoded constants)."
  - "A /station/checkin endpoint normally demands a time-derived token ('code_mismatch: expected token derived from current sync time', with a suspiciously fixed sync_time of 2019-01-02T03:14:07Z -- digits of pi), but setting the User-Agent to a specific leaked trusted-agent string (StationSync-Agent/2.1, found via robots.txt Disallow hints) makes the server skip the token check entirely."
  - "The assigned session id (sid) appears to be derived from the client's perceived IP (via X-Forwarded-For/X-Real-IP), with localhost-like values (127.0.0.1) treated specially, but repeated identical requests do not always return the same sid -- derivation is not a pure deterministic function of the headers alone."
key_idea: "A backend that trusts a specific literal User-Agent string to skip an otherwise-enforced time/token check, combined with a session id that appears to depend on perceived client IP (via X-Forwarded-For), suggests the end goal is to make the server believe the request originates from a trusted internal station IP to receive an escalated/assigned sid -- but the sid-derivation function must be fully reverse-engineered (including why identical requests sometimes vary) before that path can be driven reliably."
prerequisites:
