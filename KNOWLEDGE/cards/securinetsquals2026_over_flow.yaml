pitfalls:
  - "Finding a signed-vs-unsigned comparison bug does not automatically mean you have a useful bounded overflow -- check what every out-of-range value you can pass actually becomes after any later sign-extension or size_t cast; a 'passes the check' negative value can sign-extend into an effectively infinite copy length that just hangs the process."
  - "When a buffer overflow's maximum reachable copy length is computed from one function's allowed input size, re-derive the EXACT byte offset it reaches in the CALLER's frame (not just whether it 'overflows into' the caller) -- an overflow that reaches and passes the caller's own canary check does not necessarily reach the caller's saved return address if there's a gap in between."
failed_paths:
  - "count=-1 (and other negative values) pass the signed <=0x70 check but sign-extend to near-2^64 for memcpy, producing a hang rather than a controlled overflow of any useful size."
  - "Copying the full allowed 0x70 bytes into main's buffer overwrites main's own canary with input's matching (same TLS) canary value (so the check still passes) but lands exactly at [rbp], 8 bytes short of main's saved RBP and further still from the saved return address -- this specific copy length cannot reach RIP."
