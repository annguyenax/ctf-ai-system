signals:
  - "A length-check `cmp eax, 0x70; jle` on a `scanf`-read int32 `count` is a SIGNED comparison, so any negative `count` also passes the `<= 0x70` check and then gets sign-extended (`movsxd`) into a near-maximum `size_t` for the subsequent `memcpy` call -- not a small controllable overflow, but effectively `memcpy(dst, src, ~2^64)`, which hangs/crashes rather than yielding a useful short overflow."
  - "A second, intermediate function's own stack canary sits between the attacker-controlled copy source and the ultimate destination buffer in `main`; copying up to the full allowed length (0x70 bytes) overwrites `main`'s canary with 8 bytes that happen to equal `input`'s own (same-TLS) canary value, so the check still passes, but `main`'s saved RBP and return address remain 8+ bytes further away and are never reached by this particular copy."
  - "A separate `escape()` helper doubles every `%` byte in the user string before `printf`ing it with no format-string argument-count validation, and OOB reads leaked PIE-internal addresses (not libc) through this printf -- but only within the single request/response of one connection, with no second turn to use the leaked address."
key_idea: "A length check using a SIGNED comparison against an int32 user input can be bypassed with negative values, but don't assume that automatically yields a useful short overflow -- verify what the negative value sign-extends to when later used as an unsigned size_t (here, effectively unbounded, causing a hang rather than a controlled few-byte overflow); separately, a function-local buffer's own canary can silently absorb bytes that would otherwise have reached a caller's return address, so trace the EXACT byte offsets a copy reaches in each stack frame before assuming the maximum-allowed-length path reaches RIP."
prerequisites:
  - "signed vs. unsigned comparison bugs"
  - "stack frame layout tracing across nested function calls"
  - "single-shot (no second-turn) leak-then-use infeasibility recognition"
exploitation_pattern: "confirm the count<=0x70 check is signed and any negative int32 passes it -> trace exactly how much of the read buffer memcpy's into each enclosing frame at the maximum ALLOWED (non-negative, non-huge) length -> determine the copy stops 8 bytes short of main's saved RIP -> separately analyze escape()'s %-doubling printf for an OOB/format leak, but note the single-request/no-second-turn structure prevents using any leaked address productively without another primitive."
verification:
  method: "Not solved; this documents a precise negative result (why the obvious signed-compare bypass and the length-0x70 overflow both fail to reach RIP) for the next session."
