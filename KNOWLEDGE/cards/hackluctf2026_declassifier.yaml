signals:
  - "A 512-byte stack buffer is in-place rewritten by a 'redact' function that replaces every 4-byte match with a 10-byte string, shifting the tail right by 6 bytes per match with no bound check against the original buffer size -- N matches grow the content by 6*N bytes past the end."
  - "The target is static, no-PIE, no stack canary; the only usable gadgets are `__restore_rt` (sigreturn trampoline) and a bare `syscall; ret` -- no clean pop-rdi/rsi/rdx chain exists, ruling out classic ROP."
  - "Only one SROP frame fits in the single 512-byte overflow, so the first frame must bootstrap a second stage by pivoting the stack to a fixed `.bss` address via a `read(0, bss, big_size)` syscall whose return then pops the next (fully attacker-controlled, size-unlimited) stage from `.bss`."
key_idea: "When a string-replace routine expands its match in place without adjusting the destination buffer's bound check, the overflow length is exactly `(replacement_len - match_len) * match_count`, giving byte-precise control over where the overflow lands; combine that with hand-built SROP (no pwntools dependency) through a two-stage sigreturn chain that first pivots to a fixed, size-unlimited `.bss` landing zone, defeating the single-request 512-byte size cap."
prerequisites:
  - "sigreturn-oriented programming (amd64 248-byte sigcontext layout)"
  - "stack-pivot via second syscall stage"
  - "no-PIE/no-canary gadget hunting with only __restore_rt and syscall;ret available"
exploitation_pattern: "compute k*match_len + pad + gadget+sigframe1 == overflow target offset -> sigframe1 does read(0,.bss,big) with rsp=.bss, pivoting the stack -> second (unbounded) write delivers sigframe2 (execve('/bin/sh')) plus the '/bin/sh' string at a fixed .bss offset -> catv /flag over the resulting shell."
