pitfalls:
  - "An in-place string-replace that expands content (replacement longer than match) without re-checking the destination buffer's capacity is a precise, attacker-controllable-length stack overflow -- compute the exact byte offset the overflow reaches as a function of match count, not just 'it overflows'."
  - "When no clean multi-argument pop-gadget chain exists in a no-PIE binary, check for `__restore_rt`/any `mov eax,15; syscall` sequence to build SROP frames by hand; a single input-size cap can be bypassed by using the first SROP frame to `read()` an unbounded second stage into a fixed, writable segment."
