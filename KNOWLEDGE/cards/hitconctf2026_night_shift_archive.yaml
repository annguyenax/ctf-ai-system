signals:
  - "Instancer gives a ttyd (web terminal) shell reachable programmatically only by connecting its raw websocket with subprotocols=['tty'] (a plain websocket connect without that subprotocol gets a 101 but no frames) and sending a JSON auth/size handshake before any stdin frames."
  - "A private D-Bus session bus exposes a coordinator service (Stage/Submit/Discard/ListRecords/GetHistory, all usable by the low-priv player) and a worker service that denies every method call including introspection -- but error messages from the denial still leak the worker's real interface/method names."
  - "An admin-only service connects fresh every 10s, logs 'submitted the nightly verification' then 'giving up after waiting for verification', and never succeeds even on a clean instance -- the admin's own flow appears designed to be completed by the player somehow (unresolved)."
key_idea: "Map the full D-Bus object/method/policy surface from the outside using systematic probing (benign calls, malformed names, introspection-denial error text) before guessing exploit primitives; here the coordinator's Submit() accepted a validation bypass (Stage a bogus name then Submit its generated stg-id instead of the rejected literal name) but no path from that into the worker or the admin's stalled verification job was found."
prerequisites:
  - "D-Bus method/policy model"
  - "ttyd websocket protocol (subprotocol negotiation, binary frame prefixes)"
exploitation_pattern: "enumerate D-Bus services/objects/interfaces via introspection + error-message leakage -> find input-validation bypass in a permitted method (Stage+Submit instead of direct Submit) -> look for a way that bypass reaches the denied worker or stalled admin verification job (not yet found)."
