pitfalls:
  - "A bare websocket connection to a ttyd instance returns HTTP 101 but delivers no frames unless the client negotiates the 'tty' subprotocol and sends the JSON auth/size handshake first -- don't mistake the silent 101 for a dead service."
  - "AppArmor/D-Bus policy denials often still leak the target interface/method names in their error text; read denial messages carefully even when every call is rejected."
failed_paths:
  - "Direct Submit() with a literal unknown record name ('verification') is rejected outright, but Stage(x)+Submit(returned stg-id) bypasses that validation -- exploring further from there did not yet reach the worker or unstick the admin's job."
