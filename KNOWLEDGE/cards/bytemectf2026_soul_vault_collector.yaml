pitfalls:
  - Treat 48-byte requests as 0x40-byte chunks and track the object allocation before its inner memory allocation.
  - A `%s` leak prints the callback bytes only because the overlapping memory pointer is set to object+0x28.
  - The line-based reader stops on byte 0x0a, so check safe-link encodings before sending them.
