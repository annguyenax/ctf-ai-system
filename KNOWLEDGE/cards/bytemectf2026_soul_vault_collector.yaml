signals:
  - release_soul frees the 0x40-byte soul object but leaves souls[index] unchanged.
  - Inspecting freed objects leaks the tcache page key and safe-linked next pointer.
  - A 48-byte allocation shares the soul object’s 0x40 tcache size class; poisoning the freed fd to object+0x20 overlaps its fields.
  - The ritual counters are contiguous at PIE+0x40e0 and the success branch invokes system("/bin/sh").
key_idea: Recover adjacent heap object addresses from safe-linking, overlap the soul callback field for a PIE leak, then poison a second tcache allocation into the three BSS ritual counters.
prerequisites:
  - x86-64 PIE and ELF symbol/disassembly triage
  - glibc tcache safe-linking and allocation size classes
  - Binary-safe interaction with newline-terminated input
exploitation_pattern: stale alias after free -> safe-linking heap recovery -> adjacent tcache overlap -> callback PIE leak -> BSS counter write -> gated shell.
verification:
