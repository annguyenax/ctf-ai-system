key_idea: Flipping bit 0 of checkpoint offset 1 turns mov eax, 0xe (rt_sigprocmask) into mov eax, 0xf (rt_sigreturn). Since enter sets rsp=arena, rt_sigreturn immediately unpacks a SigreturnFrame from arena. Any non-zero syscall return (like openat returning fd=3 or read returning byte count) jumps back to checkpoint and executes rt_sigreturn again on the current rsp, enabling chained SROP.
exploitation_pattern: bitflip rt_sigprocmask -> rt_sigreturn -> Stage 1 SROP read() more frames into arena -> Stage 2 SROP openat("flag.txt") -> read(fd) -> write(stdout)
