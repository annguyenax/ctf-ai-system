signals:
  - A DNS response packet contains an unusually high number of Answer resource records for a single query (14 RRs: NS, A, TXT) — far more than a normal lookup returns.
  - This is the signature of a successful AXFR (full zone transfer) against a misconfigured authoritative DNS server that doesn't restrict transfers to authorized secondaries.
  - A TXT record for a subdomain like `_flag.<zone>` directly carries the flag as its RDATA.
key_idea: A DNS answer with many resource records for one query/zone is the fingerprint of an AXFR zone transfer; a misconfigured DNS server that allows AXFR from anyone leaks its entire zone file (NS/A/TXT/etc. for every subdomain) in one response — scan a captured AXFR response's records directly for a TXT record holding the flag.
prerequisites:
  - A pcap containing the DNS AXFR exchange (query type AXFR, multi-record response)
exploitation_pattern: parse pcap with scapy -> find DNS packets where ancount is large relative to a normal query -> iterate answer records -> find the TXT record (type 16) whose RDATA contains the flag pattern.
verification:
  method: Iterating DNS answer records in the identified AXFR response frame found a TXT record whose RDATA was the literal flag string.
  evidence: "D:/download/CTFTimeWriteup/DeadfaceCTF2026/TrafficAnalysis/Twilight Zone Transfer/writeup/writeup.md"
pitfalls:
  - Must check the answer section's RR *type* (TXT=16) rather than assuming the flag is always in the first/largest record.
