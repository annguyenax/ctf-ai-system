time_heuristic: "When manually reimplementing LUKS2 (rather than using cryptsetup), double-check both the keyslot-area IV baseline (area-relative, not absolute-device) and the segment IV unit convention (always 512 bytes for plain64, regardless of logical sector size) before concluding a passphrase is wrong -- a wrong IV convention can still decrypt sector 0 plausibly while corrupting everything after it."
