signals:
  - An HTTP staging-config fetch reveals a C2 domain used for later DNS-based exfiltration.
  - DNS queries use sequentially-numbered subdomain labels (`s00-...`, `s01-...`) encoding Base32 chunks of ciphertext.
  - "The flag format is known in advance (`deadface{...}`), which is itself a known-plaintext crib against the XOR-obfuscated payload."
key_idea: "For DNS-tunneled exfiltration with an XOR-obfuscated payload, reassemble the Base32 chunks in label-sequence-number order first to get the full ciphertext, then use the known flag prefix (`deadface{`) as a known-plaintext crib: XOR the first bytes of ciphertext against the expected prefix to recover the repeating XOR key, then decrypt the rest."
prerequisites:
  - Knowing (or assuming) the exact flag prefix format to use as a crib
  - Correctly ordering DNS labels by their embedded sequence number before Base32-decoding
exploitation_pattern: extract DNS query labels matching `s<seq>-<base32chunk>.<c2domain>` -> sort by seq -> concatenate base32 chunks -> base32-decode to ciphertext bytes -> XOR first len("deadface{") bytes of ciphertext against "deadface{" to recover the repeating key -> XOR the full ciphertext with the repeating key -> read plaintext flag.
verification:
