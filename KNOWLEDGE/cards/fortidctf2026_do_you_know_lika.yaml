pitfalls:
  - "Prototype-pollution blocklists that check only '__proto__' miss 'constructor.prototype', a functionally identical bypass."
  - "Any plain JS object used as a security allowlist (e.g. writableProperties = {a:true,...}) is itself vulnerable to prototype pollution unless created with Object.create(null) or checked via hasOwnProperty."
