signals:
  - "containsBlockedKey() blocks only the literal key '__proto__', missing the equally dangerous 'constructor.prototype' path for prototype pollution."
  - "A helper allowlist object (writableProperties) is a plain object, so it inherits polluted Object.prototype properties and treats a polluted key as allowed."
  - "Handlebars {{> @partial-block}} invoked twice inside a partial lets the second invocation fall back to compiling an attacker-supplied AST when @partial-block itself was overwritten (CVE-2026-33938 class bug)."
key_idea: "Chain three independent gaps: pollute Object.prototype via constructor.prototype (bypassing a __proto__-only blocklist), use that pollution to make a helper's property allowlist accept a forbidden key, then use the now-permitted helper to overwrite the @partial-block AST reference with a crafted PathExpression whose 'depth' field is actually attacker JS source, which the Handlebars compiler evaluates as an IIFE and executes server-side."
prerequisites:
  - Node.js Handlebars app with blocklist-only (not allowlist) key filtering
  - A helper that mutates template-engine internal AST/data objects based on an attribute the attacker can rename via pollution
exploitation_pattern: "constructor.prototype pollution bypassing __proto__-only filter -> inherited allowlist bypass -> overwrite @partial-block with malicious PathExpression AST -> template compiler executes attacker JS"
