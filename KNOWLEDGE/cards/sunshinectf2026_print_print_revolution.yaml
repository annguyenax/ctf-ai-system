pitfalls:
  - "A custom write-primitive conversion (%w here) may under-count how many argument slots it consumes relative to how many it reads -- issuing multiple such writes in the same call can silently corrupt later writes; issue one write per call/line as a safe default until the counter behavior is confirmed."
  - "No bundled libc does not mean libc offsets are unknowable -- if other challenges in the same CTF/infra specify a glibc version, reuse those offsets."
