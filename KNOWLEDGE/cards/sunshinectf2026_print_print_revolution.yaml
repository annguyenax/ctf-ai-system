signals:
  - "A custom-built printf-like function is called on user input with no real variadic arguments supplied -- an uninitialized-varargs format string, functionally equivalent to a classic fmtstr bug but on a hand-rolled parser."
  - "The custom parser implements a non-standard conversion %w meaning 'arbitrary 8-byte write at *arg using the next arg as the value', but it only advances its internal argument counter by 1 per %w while consuming 2 argument slots -- consecutive %w conversions on the same line overlap/corrupt each other's arguments."
  - "No libc is provided for this challenge even though the infra is known to run a specific glibc version shared with other challenges in the same event -- that known-common libc can be reused for offset calculations."
key_idea: "A custom (non-glibc) printf reimplementation can still be exploited exactly like a real format-string bug (leak via %p/%x/%s-style conversions, arbitrary write via a custom write-conversion), but its own argument-counter bookkeeping may have its own bugs (e.g. under-counting consumed arguments for a multi-value conversion) -- reverse that counter's exact semantics and issue only ONE such write-conversion per line/call to avoid self-corruption, rather than assuming it behaves like glibc's."
prerequisites:
  - "ret2dlresolve technique (pwntools Ret2dlresolvePayload/ROP.ret2dlresolve) when no libc base can be leaked/trusted directly"
  - "Reverse-engineering a custom printf-style parser's argument-consumption semantics"
exploitation_pattern: "leak a stack value via many %p conversions to find saved RBP / main's return-into-libc value -> compute libc base from a known offset (same glibc version as the rest of the event) -> build a ret2dlresolve payload for system(cmd) using the binary's own .bss as scratch space -> write each piece of the ret2dlresolve payload one %w write per line to avoid the counter-overlap bug -> overwrite the return address slot with the ROP chain -> trigger return via EOF/connection shutdown -> read command output"
