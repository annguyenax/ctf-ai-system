signals:
  - "pom.xml artifact naming suggests FreeMarker, but the actual Maven dependency declared (twice) is Apache Velocity 1.7."
  - "A translation form substitutes user input directly for a TEXT placeholder in an HTML template string, then calls runtimeServices.parse + Template.merge (Velocity's template-string evaluation API) with no sanitization."
  - "#set($x=7*7)$x evaluating to 49 in the response immediately confirms live server-side template evaluation of a Velocity expression."
key_idea: "Don't trust a project's apparent branding/artifact name as the template engine identity; verify by checking the actual dependency declarations and by sending a cheap arithmetic probe (#set($x=7*7)$x for Velocity, ${7*7} for FreeMarker/others) directly against the live app. Once Velocity SSTI is confirmed, use the empty-string .class.forName('java.lang.Runtime') chain to get Runtime.exec, then read the process's stdout via #foreach over InputStream.available()/read() characters to retrieve a file's contents without ProcessBuilder or external libraries."
prerequisites:
  - Java app embedding untrusted input into a template string later evaluated by a template engine (any engine)
  - Willingness to disambiguate claimed vs actual template engine before building a payload for the wrong one
exploitation_pattern: "probe with a cheap arithmetic SSTI test string matching the real (not assumed) engine syntax -> confirm with #set($x=7*7)$x==49 -> Velocity .class.forName Runtime.exec chain reads flag file via process stdout"
verification:
  method: "Live POST with the Velocity Runtime.exec payload directly returned the flag file's contents in the HTTP response body; replayed a second time with identical result."
  evidence: "D:/download/ctf-ai-system/OUTPUT/_archive/HTB-TryOut/web/Labyrinth Linguist/final_flag.txt"
pitfalls:
  - "A project's artifact/class naming (e.g. suggesting FreeMarker) can be misleading; always confirm the actual template engine from the real dependency manifest and a live syntax probe before building an SSTI payload."
  - "Velocity restricts direct string literals' .class access in some configurations, but an empty string variable's .class.forName() chain reliably reaches arbitrary classes including java.lang.Runtime."
