signals:
  - Mobile app's API requires an internal header token + User-Agent (recovered from APK reverse engineering in a prior challenge) but authorization is by a valid session token of *any* user, not by resource ownership.
  - Endpoints like `/api/accounts/<account_id>/statements` take a numeric, low-cardinality account_id with no ownership check against the logged-in user.
  - A low-privilege, independently-leaked credential (found via OSINT on a separate forum/social platform) is enough to obtain a valid session and then pivot into IDOR.
key_idea: Once authenticated as *any* user (even a leaked low-value credential), test object-reference endpoints by varying the ID parameter across a plausible numeric range near known values; a BOLA/IDOR vulnerability returns other users' or system/internal records without any ownership check.
prerequisites:
  - A valid session/auth token (from any account, however obtained)
  - A resource endpoint parameterized by a guessable/sequential ID
exploitation_pattern: login with leaked creds -> obtain bearer token + required internal headers -> iterate account_id over a candidate range -> call ownership-scoped endpoint for each ID -> flag/sensitive data appears in an ID that does not belong to the logged-in user.
verification:
  method: Script logged in, then fuzzed account_id starting at 1000; account_id=1007 returned an internal-audit statement record containing the exact flag string, matching final_flag.txt.
