signals:
  - "A tiny static, stripped ELF with almost no usable ROP gadgets, but the remote stack is non-executable (NX) despite the binary lacking a PT_GNU_STACK header -- gadget scarcity rules out a normal ROP chain."
  - "One function leaks a stack address by pushing rsp and writing it out, then reads a small fixed-size buffer at a known offset from that leaked address -- enough to place a controlled return value."
  - "A second function has a classic stack buffer overflow that overwrites the return address, and among the few available gadgets is a 'read N bytes, set rax from its return value, ret' gadget -- exactly what's needed to set rax=15 (SYS_rt_sigreturn) before the next ret."
key_idea: "When a binary has almost no ROP gadgets but DOES have a read-like gadget whose return value lands in rax, that is enough to perform a full Sigreturn-Oriented Programming (SROP) attack: use it to set rax=15 (rt_sigreturn), return into a bare syscall;ret gadget, and let the kernel restore an attacker-crafted sigcontext structure that sets every register (including rdi/rsi/rdx and a direct rip to a second syscall instruction) in one shot -- enabling execve('/bin/sh') with no other gadgets needed."
prerequisites:
  - "SROP / sigcontext structure layout on x86-64 Linux (offsets for rdi, rsi, rdx, rax, rsp, rip, csgsfs within the frame)"
  - "Identifying any single gadget whose own return value controls rax, to set up rt_sigreturn's syscall number without a `pop rax; ret` gadget"
exploitation_pattern: "leak a stack address via the info-leak function -> compute /bin/sh string placement relative to that leak -> overflow the return address of the vulnerable function with the read-gadget address -> send exactly 15 bytes so the gadget's return value sets rax=15 -> that gadget's own ret lands on a bare syscall;ret gadget, invoking rt_sigreturn -> rt_sigreturn restores a forged sigcontext with rax=59 (execve), rdi=&'/bin/sh', rsi=rdx=0, and rip=syscall again -> shell spawns"
