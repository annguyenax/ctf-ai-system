time_heuristic: "If an API demands custom signature headers and no amount of header/JWT fuzzing budges the error, decompile the mobile client for the signer code -- a scheme that derives its HMAC key from a hardcoded pepper plus a client-supplied device id has no real server secret and lets any client self-sign privileged requests the app never issues."
