  Full libc write is blocked by the heap bounds, so code exec uses a glibc-internal
  largebin attack (p1->bk_nextsize = _IO_list_all-0x20) to point _IO_list_all at a
  controlled chunk, then House of Apple 2 (fake _IO_FILE_plus with _IO_wfile_jumps
  vtable) is triggered by the SIGALRM(60s)->exit(0) flush.

