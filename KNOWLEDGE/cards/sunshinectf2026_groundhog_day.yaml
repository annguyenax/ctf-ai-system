pitfalls:
  - "A commented-out parameter in client-side JS/HTML is not proof the server-side handler was removed -- test it directly."
  - "gopher:// SSRF payloads must get byte-for-byte protocol framing right (CRLF line endings, Content-Length) since the target service parses it as a literal raw request, not just a URL fetch."
