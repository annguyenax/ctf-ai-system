signals:
  - "Top-level zip password = sha256(FLAG).hexdigest()  (PASSWORD_MODE='sha256_digest')"
  - "RSA moduli are 280-bit (two 140-bit primes) => factorable by ECM/SIQS/GNFS"
  - "Nested 3-layer zips: chall.zip -> secret.zip -> flag.zip (random_password layers)"
  - "flag.txt inside final zip is a DECOY whose sha256 does NOT match the top password"
  - "sub-challenge plaintexts are hex strings that decode to REVERSED flag fragments"
key_idea: "I = Integrity. The outer zip password is the SHA-256 of the real flag, so the flag is the unique string whose sha256 equals the recovered password (preimage cannot be forged). The decoy flag inside flag.txt is rejected. Reconstruct the real flag by solving the flag-bearing sub-challenges (chall3 batch-gcd, chall6 Hastad e=3, chall7 Rabin), each yielding a reversed hex fragment."
prerequisites:
  - RSA decryption from factored 280-bit modulus
  - AES-zip password opening (Python zipfile/pyzipper)
  - Hastad broadcast (CRT + integer cube root, e=3)
  - Rabin decryption (sqrt mod p,q = 3 mod 4 via CRT)
  - RSA batch-GCD (shared prime among moduli)
exploitation_pattern: "factor small RSA moduli -> recover sha256 password -> unpack nested AES zips -> solve flag sub-challenges -> decode+reverse hex fragments -> concatenate -> verify sha256(flag)==password"
verification:
  method: "Deterministic solver replay + independent SHA-256 preimage check. The recovered top password opens chall.zip (AES decrypt verified); sha256(reconstructed flag) equals that password exactly."
  evidence: "sha256(PTITCTF{1_574nd5_...pr0p3rtY}) == 1fcbf4aa0eb78c74f822684fa93cda458e431365e96b2c04abe5cdd56fca9733 == working chall.zip password. All 3 zip layers opened with password derived from RSA segment decryptions."
pitfalls:
  - "Submitting the flag inside flag.txt (decoy) gets rejected; must satisfy the integrity hash."
  - "chall3 batch-gcd loop must skip comparing a modulus with itself (gcd == n)."
  - "Hastad needs integer cube root (gmpy2.iroot), not float ** (1/3)."
  - "Bundled chall.py PUBLIC_SEGMENTS may be a stale copy that does not re-encrypt the recovered chunks; verify by decrypting the zips."
failed_paths:
