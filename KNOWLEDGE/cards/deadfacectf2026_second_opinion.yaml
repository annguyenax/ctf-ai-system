signals:
  - UI redacts patient info to initials/masked MRN, but the device also exposes a maintenance/debug display port (simulated HDMI) unauthenticated.
  - The debug mirror endpoint accepts an `OSD level` (0-3); redaction is a UI-layer concept that the raw diagnostic mirror does not apply.
  - "Field manual documented OSD levels 0-3 but the redaction policy was never actually enforced below the top application layer."
key_idea: When a device has a secondary/maintenance output (debug HDMI mirror, diagnostic port, service display) distinct from the user-facing UI, redaction applied in the main UI is not guaranteed to apply to that secondary channel — query it directly, and try the highest privilege/verbosity level it documents.
prerequisites:
  - Reading the field/service manual for documented debug ports and levels
  - Simple connect+query API/physical-port simulation
exploitation_pattern: "connect maintenance port -> request raw/debug mirror at max documented level -> server returns unredacted backing data (here: full patient object including flag)."
verification:
  method: GET /api/external-display?level=3 returned JSON object containing full unredacted patient fields and the flag.
