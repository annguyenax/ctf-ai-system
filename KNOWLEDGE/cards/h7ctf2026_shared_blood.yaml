signals:
  - "A fleet/batch of ~30 RSA public keys (moduli) generated by the same \"assembly line\" (shared/poor entropy source), plus one intercepted ciphertext for a specific target device."
key_idea: "When many RSA public moduli are generated under shared or low-entropy conditions, compute gcd(N_target, N_i) against every other modulus in the fleet; a non-trivial gcd (1 < g < N_target) reveals a shared prime factor p, from which q = N_target/p and the private exponent d = e^-1 mod (p-1)(q-1) follow immediately."
prerequisites:
  - "A set of candidate moduli large enough to likely contain a colliding pair"
  - "Standard RSA decryption / PKCS#1v1.5 padding parsing"
exploitation_pattern: "fetch all fleet moduli -> for each, gcd against the target modulus -> first non-trivial gcd gives shared prime p -> factor target modulus fully -> compute d -> decrypt target ciphertext -> parse PKCS#1v1.5 to recover the plaintext token -> submit token to the gated endpoint for the flag."
