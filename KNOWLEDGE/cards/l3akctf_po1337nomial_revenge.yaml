key_idea: >
  Revenge of Crew CTF 2025 po1337nomial. Original leaked y = sum a_i*1337^i (recover
  ordered coeffs via base-1337 backtracking, then randcrack MT). This version REDACTS y,
  so the only leak is option-1's shuffled multiset of the first 1337 getrandbits(32).
  Need to recover MT19937 state from an UNORDERED multiset -> hard cryptanalysis
  (arrange the untempered multiset to satisfy the MT GF(2) recurrence over the 713 extra
  values). Info-theoretically possible (~30k bits > 19937) but no quick algorithm found.
