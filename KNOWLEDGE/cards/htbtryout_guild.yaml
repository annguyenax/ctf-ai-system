pitfalls:
  - "A WAF that blocks RCE-enabling tokens (__, [], os, popen, class, attr) on an SSTI sink doesn't stop that same sink from leaking data via any object already present in the template context (e.g. an ORM model instance) -- treat a 'blocked' SSTI as still useful for read-only leaks."
  - "A password-reset token that is just hash(email) with no server-side secret is forgeable by anyone who learns the target email, regardless of hash strength."
  - "When one SSTI sink is filtered, look for a second, differently-reachable sink (here, an EXIF metadata field re-rendered only for an admin-only action) that may have no filtering at all."
