signals:
  - "A profile-share feature does render_template_string(template % bio), evaluating Jinja2 on the user-controlled bio with the ORM User object present in context."
  - "A WAF/filter blocks substrings like __, [], os, popen, config, attr, class, * on bio content, but doesn't block reading plain attributes like other users' fields via the ORM object already in context."
  - "A password-reset token is sha256(email) with no secret/salt/expiry, and an admin-verification endpoint re-renders an EXIF 'Artist' tag with render_template_string and no WAF filtering at all."
key_idea: "Use the WAF-filtered bio SSTI only to read data (leak the admin's email via the ORM object already in Jinja2 context, e.g. {{User.query.get(1).email}}), since the WAF blocks the tokens needed for direct RCE; take over the admin account via the unsalted sha256(email) password-reset token; then use a second, unfiltered SSTI sink (the admin's own 'Verify' action rendering an uploaded image's EXIF Artist tag) to get full RCE, since that path has no WAF at all."
prerequisites:
  - Multiple SSTI sinks in the same app with different filtering strength
  - "An ORM/ambient object already present in one sink's template context, letting a WAF-blocked RCE site still leak data via plain attribute access"
  - A predictable password-reset token (hash of a known/leakable value, no secret or expiry)
exploitation_pattern: "WAF-filtered SSTI sink used for data leak only (ORM attribute read) -> leak admin email -> forge password-reset via unsalted hash(email) -> takeover admin -> unfiltered second SSTI sink (EXIF tag re-render) for full RCE"
