signals:
  - A rogue host on the LAN answers a victim's LLMNR name-resolution query with a poisoned response (classic Responder-style attack).
  - "Victim workstation immediately opens an SMB2 session to the attacker's IP right after the poisoned reply frame."
  - SMB2 Session Setup carries NTLMSSP_NEGOTIATE -> CHALLENGE -> AUTH, and the AUTH frame contains the victim's NTLMv2 response including NTProofStr.
key_idea: To pull a crackable/identifying NTLMv2 value out of a pcap showing LLMNR poisoning, find the poisoned response frame, then look at the very next SMB2 session from that victim to the attacker IP, and extract the NTLMSSP fields (username, NTProofStr) from the AUTH frame with tshark.
prerequisites:
  - tshark/Wireshark with NTLMSSP dissector support
  - Identifying the victim/attacker IPs from the LLMNR query/poisoned-response pair first
exploitation_pattern: filter LLMNR query+response -> note victim IP and poisoner IP -> find subsequent SMB2 Negotiate/SessionSetup frames between them -> `tshark -r cap.pcap -Y "frame.number == N" -T fields -e ntlmssp.ntlmv2_response.ntproofstr` (or `-e ntlmssp.auth.username`) on the AUTH frame.
verification:
  method: tshark field extraction on the identified frame printed the exact 16-byte NTProofStr used as the flag.
  evidence: "D:/download/CTFTimeWriteup/DeadfaceCTF2026/DeMonneBreach/Challenge Accepted/writeup/writeup.md"
pitfalls:
  - Must pick the *first* SMB2 auth from the victim after the poisoned response, not an unrelated/earlier session, or the extracted bytes won't match.
