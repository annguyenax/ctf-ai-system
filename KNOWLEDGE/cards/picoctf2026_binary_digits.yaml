signals:
  - A file consisting entirely of ASCII '0' and '1' characters (not actual binary data) with no other obvious structure.
key_idea: A file of literal ASCII '0'/'1' text is almost always a byte stream written out as binary digits rather than bits already packed into bytes. Filter to keep only '0'/'1' characters, chunk into groups of 8, and convert each chunk with `int(chunk, 2)` to rebuild the real byte stream — check the first few resulting bytes against known file magics (here `FFD8FFE0` = JPEG) to confirm correct framing before further processing.
prerequisites:
  - Recognizing ASCII-encoded binary text vs. actual binary content
  - Common file-magic bytes for sanity-checking reconstruction
exploitation_pattern: filter file content to '0'/'1' characters only -> group into 8-bit chunks -> int(chunk,2) per chunk -> reassemble bytes -> check magic bytes -> save as the identified file type -> read flag visually/by content from the reconstructed file.
