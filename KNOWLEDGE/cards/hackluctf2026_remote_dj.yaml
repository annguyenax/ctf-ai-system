pitfalls:
  - "Never read and write the same Python SSL socket from two threads concurrently against a line-based TCP protocol -- it corrupts the stream; use one connection, send-then-read, sequentially."
  - "A silent/no-output response from a line-protocol service is not necessarily failure -- cmus's remote protocol replies to every command with a trailing newline but is otherwise quiet."
  - "A spawned child process's file descriptors (including a non-O_CLOEXEC client socket inherited by the parent) can become an exfiltration channel independent of the challenge's visible I/O -- check fd 3+ for an inherited network socket before assuming you need a separate out-of-band channel."
failed_paths:
  - "/proc/<pid>/fd/<n> cannot be used to write to a socket target (returns ENXIO) -- the inherited fd number must be used directly via the shell's own fd redirection, not via its /proc path."
