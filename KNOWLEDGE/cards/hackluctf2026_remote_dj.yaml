signals:
  - "cmus over a TCP/network connection sets `run_only_safe_commands=1`, blocking CMD_UNSAFE commands (shell, run, bind, source) -- but `set` and `pl-export` are NOT flagged CMD_UNSAFE and remain callable remotely."
  - "`:set skip_track_info=true` makes cmus accept any `http://`-prefixed string as a track filename with zero validation (no decode/probe), letting an arbitrary string (including shell metacharacters) become a stored 'track'."
  - "`:pl-export <path>` writes every track filename in the current playlist verbatim (newline-separated) to an arbitrary writable path, and `:set status_display_program=/bin/bash` causes cmus to `execvp('/bin/bash', ['/bin/bash','status',status_text,...])` on the next status change -- `bash <file>` executes a script in cwd without needing +x, so writing the payload to `./status` and then changing status runs it."
key_idea: "A network-safety allowlist that blocks obviously dangerous commands (shell/run/bind/source) but forgets that `set <option>=<value>` plus a file-writing command (`pl-export`) can be combined to drop an arbitrary script file, and that an auxiliary 'run an external program on status change' feature (`status_display_program`) then executes it, reconstitutes full remote code execution from commands that were individually deemed 'safe' for network use."
prerequisites:
  - "cmus remote protocol/command set"
  - "bash <file>-without-+x execution semantics"
  - "fd-inheritance exfiltration (writing flag output to an inherited socket fd)"
exploitation_pattern: "set skip_track_info=true -> add an http:// track whose string is a shell one-liner -> pl-export that playlist to ./status -> set status_display_program=/bin/bash -> trigger any status change (player-pause/play/stop) so bash ./status executes, running /readflag and writing its output to an inherited fd that round-trips back through the TLS connection."
