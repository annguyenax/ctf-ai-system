signals:
  - "A shellcode-execution sandbox blocks only the execve syscall and allows everything else."
key_idea: "When a shellcode sandbox blocklists only execve (or a small syscall set), the standard bypass is Open-Read-Write (ORW) shellcode: open(\"/flag\", O_RDONLY) -> read(fd, buf, N) -> write(STDOUT, buf, N) -- none of these syscalls are typically blocked, and this reads the flag without ever needing a shell. Push the target path string onto the stack and point rdi at it rather than needing a data section."
prerequisites:
  - "Basic x86-64 raw syscall shellcode writing (syscall numbers 2/0/1 for open/read/write)"
exploitation_pattern: "craft ORW shellcode (push path bytes to stack, open, read into stack buffer, write to stdout, exit) -> send over the raw TCP connection -> shutdown(SHUT_WR) to signal EOF if the sandbox reads until EOF -> flag printed in the response."
verification:
