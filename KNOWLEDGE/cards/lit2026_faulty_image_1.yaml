  - "Challenge text repeats 'haha'"
  - "Bytes 68 61 68 61 ('haha') appear at file offsets 100,204,308,... every 104 bytes"
key_idea: >
  Tamper INSERTS a fixed 4-byte marker b'haha' every 100 original bytes (stride
  104). Reverse by keeping 100 bytes then skipping the 4-byte marker, which
  restores the original IDAT; it decompresses to 150*(1+400*3)=180150 bytes.
prerequisites:
  - PNG chunk structure (IHDR/IDAT/IEND, CRC)
  - zlib/DEFLATE; raw scanline size = h*(1+w*channels)
exploitation_pattern: >
  Locate periodic inserted marker -> strip it on the fixed stride -> reparse IDAT
  -> zlib.decompress -> rebuild clean PNG -> render to read flag text.
verification:
  method: deterministic reconstruction; decompressed size matches exact raw size
  evidence: "raw len 180150 == 150*(1+400*3); image renders the flag; solver replay identical"
pitfalls:
  - "Insertion (reversible) vs overwrite (lossy): equal spacing + fixed marker => insertion."
  - "Repetitive compressed bytes (e.g. 70836001) can be legit deflate of flat color, not damage."
  - "Partial zlib decompress yields nothing: a dynamic-Huffman block is atomic; must repair first."
failed_paths:
