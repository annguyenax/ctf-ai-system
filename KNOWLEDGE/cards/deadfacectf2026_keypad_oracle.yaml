signals:
  - iOS Simulator app bundle ships a debug dylib with full Swift symbols and DWARF metadata (not stripped) — disassembly is directly readable, no symbolication needed.
  - PIN is constrained to 4 unique, non-repeating digits, so the full keyspace is only 10*9*8*7 = 5,040 permutations — small enough to brute force without any crypto break.
  - Custom "PinCipherEngine" is a bespoke per-digit mix of XOR with a salt, position/digit-derived rotation, and modular addition, folded with a static binary salt — fully deterministic given the PIN.
key_idea: When a binary's custom cipher is deterministic and the valid-input keyspace is small (here due to a no-repeat-digit PIN constraint), don't bother inverting the cipher algebraically — faithfully reimplement the forward algorithm from the disassembly in a scripting language and brute force every candidate input until the output matches the expected/encoded value or decodes to readable ASCII.
prerequisites:
  - Full symbol/DWARF availability in the binary (debug build) for accurate disassembly
  - A small, enumerable keyspace to brute force
exploitation_pattern: disassemble PinCipherEngine.encode per-position/per-digit formula -> port formula 1:1 to Python -> itertools.permutations over valid PIN space -> run forward algorithm for each candidate -> stop at the candidate whose output decodes to printable ASCII (the flag).
verification:
  method: Brute force over all 5,040 permutations completed in under 1 second and found the one PIN whose cipher output decoded directly to the flag string.
  evidence: "D:/download/CTFTimeWriteup/DeadfaceCTF2026/Mobile/Keypad Oracle/writeup/writeup.md"
pitfalls:
  - Reversing the cipher algebraically would be much harder than just reimplementing-and-brute-forcing once the keyspace is this small — check keyspace size before attempting algebraic inversion.
