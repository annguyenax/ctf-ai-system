signals:
  - "A small .klc file defines only ~17 keys, each carrying a direction symbol (arrow glyphs like SE/E/NW or a stop square) in its normal state and the actual ASCII character in its shift state."
  - "The arrows describe physical movement on an ANSI-staggered keyboard layout (e.g. Q is diagonally SE of nothing, A is SE of Q, etc.) rather than a logical state-machine transition."
key_idea: "When a .klc file's 'normal' character values are direction glyphs (arrows / a stop square) rather than printable text, the file is encoding a physical walk across the real staggered keyboard layout: read each key's shift-state character as the output symbol and its normal-state arrow as 'which physical neighbor key to visit next', and trace the path starting from whichever key the prompt/theme implies."
prerequisites:
  - "Awareness of physical ANSI keyboard row staggering (needed to resolve 'NW/SE/E' into the correct adjacent key)"
  - ".klc layout file parsing"
exploitation_pattern: "parse .klc rows into {virtual_key: (direction_glyph, shift_char)} -> manually or programmatically map each direction glyph to the correct physically-adjacent key given ANSI row offsets -> walk the path from a plausible start key, collecting each step's shift_char, until reaching the stop glyph -> concatenated chars = flag"
