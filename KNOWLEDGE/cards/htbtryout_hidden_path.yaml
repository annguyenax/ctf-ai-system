pitfalls:
  - "Visual code review is not enough for this bug class; hexdump/byte-diff source files when something looks subtly 'off' (e.g. a seemingly-meaningless trailing comma) and no normal explanation fits."
  - "Bounds checks against array.length are only as safe as the array's actual declared contents, which can be invisibly inflated by Unicode identifiers in source."
