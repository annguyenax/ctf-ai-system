signals:
  - "A U+3164 HANGUL FILLER character (invisible when rendered) is embedded twice in the source: once in a destructuring assignment and once as an extra array element after a trailing comma."
  - "The invisible character is a legal JavaScript identifier, so it silently increases a hardcoded commands array's length from 6 to 7 while looking visually identical to a 6-element array."
  - "A bounds check (choice < commands.length) is written against the array's actual (now 7) length, not the developer's intended 6, admitting an extra attacker-controlled command slot."
key_idea: "An invisible Unicode character used as a valid JS property/variable name can silently add a hidden element to an array literal and a hidden destructured property to an incoming request body; combined, the 'extra' array slot becomes attacker-controlled shell-exec input that a naive bounds check (against the array's real length) will happily allow."
prerequisites:
  - Source hexdump/byte-level inspection (the bug is invisible in a normal text view)
  - Knowledge that many invisible/zero-width Unicode code points are valid JS identifier characters
exploitation_pattern: "hexdump reveals invisible-but-valid-identifier Unicode char used twice (destructure + trailing array element) -> send the invisible char as a body field name with attacker command -> bounds check on real (inflated) array length admits it -> exec() runs it"
