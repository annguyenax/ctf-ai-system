signals:
  - "An async Rust model of io_uring: root creates /flag.txt, writes the flag, then closes+unlinks it after a short delay; a regular UID reads commands and can hold path/buffer allocations across awaits."
  - "`create_file`/`create_symlink` treat any failed symlink resolution as 'absent' and then `HashMap::insert` at that path, so a dangling symlink can be silently overwritten -- but this doesn't expose the root inode because `unlink` separately checks ownership/`public_write` and `open` resolves symlinks before enforcing target-inode permissions."
  - "`FileHandle::read` has a possible offset+len overflow/panic, and `FileHandle::Drop` can leak reference counts when `try_lock` fails -- plausible but unconfirmed async-lifetime bug classes."
key_idea: "The straightforward symlink-then-unlink trick to clobber root's private flag path is blocked because permission checks are enforced at both unlink (ownership/public_write) and open (post-symlink-resolution), so the real bug is likely a narrower async raw-pointer/refcount lifetime issue around Drop/try_lock that needs local reproduction, not remote guessing (remote PoW difficulty 30000 made iteration expensive and the socket reset before full completion was observed)."
