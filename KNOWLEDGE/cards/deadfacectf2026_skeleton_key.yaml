signals:
  - Binary reads into a fixed stack buffer with `gets()` (no length check) — classic stack buffer overflow.
  - "A `win` function exists and prints the flag, but only if its first argument (rdi) equals a specific magic constant (0xdeadc0de) — a plain ret2win address jump is not enough."
  - Binary conveniently leaves usable ROP gadgets (`pop rdi; ret` and a bare `ret`) in its own code, no PIE/libc gadget-hunting needed.
key_idea: When a ret2win target function checks one of its arguments before doing anything useful, extend the simple return-address overwrite into a short ROP chain that sets up the required register (via `pop reg; ret`) with the exact expected value before jumping to the target function — plus a leading `ret` for 16-byte stack alignment if the target does movaps/SSE internally.
prerequisites:
  - Known buffer-to-saved-RBP offset (pwntools cyclic or static analysis) to size the padding
  - At least one `pop <arg-register>; ret` gadget present in the binary
exploitation_pattern: pad to return address (`offset = buffer_size + 8` for saved RBP) -> [optional `ret` for alignment] -> `pop rdi; ret` gadget -> magic value -> `win` function address -> send over the socket.
