signals:
  - BLE capture mixes two characteristic handles; one (0x2a) is bulk vitals noise, the other (0x37) is a low-rate maintenance log leaking a few bytes per packet.
  - Each fragment packet on the log handle carries an explicit `seq` field (0..23) plus a hex `payload`.
  - Reassembled payload decodes as Base64 -> plaintext log containing the flag in a "note:" field.
key_idea: When a sniffed capture has a low-traffic characteristic/handle distinct from the noisy bulk stream, filter to just that handle, sort fragments by their sequence field, concatenate hex payloads, then try Base64/plaintext decode on the joined bytes.
prerequisites:
  - Ability to connect a capture tool and read the full packet list via an API
  - Recognizing a handle-filter + seq-sort pattern in a mixed capture
exploitation_pattern: connect sniffer -> dump all captured frames -> filter by target handle -> sort by seq -> join hex payload bytes -> base64-decode -> read plaintext.
verification:
