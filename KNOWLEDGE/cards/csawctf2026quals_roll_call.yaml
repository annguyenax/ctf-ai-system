signals:
  - "A manual watchlist (handles) must be reconciled against a database that is the declared 'record of truth'."
  - "The identities table maps multiple handles to one person_id, meaning direct handle-to-handle comparison between two lists can give false mismatches."
  - "An explicit protocol doc (protocol.md) states reconciliation must occur by person_id, not by raw handle string."
key_idea: "When two lists of names/handles must be reconciled and a mapping table links multiple aliases to one canonical entity, always join/diff on the canonical ID (person_id), not on the raw strings, or legitimately-matching entities with different displayed handles will appear as false discrepancies."
prerequisites:
