exploitation_pattern: "read protocol.md for the reconciliation rule -> query DISTINCT person_id for both the watchlist table and the escalations table via a JOIN through identities -> set-difference escalated minus watchlisted -> look up each missing person_id's primary handle -> lowercase and alphabetically order per flag format"
