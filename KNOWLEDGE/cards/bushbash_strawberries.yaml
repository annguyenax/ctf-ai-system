category: crypto/cbc-bitflip
challenge_name: strawberries
status: solved
service: "34.40.133.67:6001"
key_idea: >
  AES-CBC bit-flip C0 sets user block to PREMIUM_USER; garbles n into huge uint64;
  when n>5 requires premium; when count>2^32 prints flag. CHECK block untouched.
prerequisites:
  - AES-CBC
  - bit-flip malleability
  - plaintext layout from source
exploitation_pattern: honest-decrypt -> C0' = C0 XOR u XOR PREMIUM -> send
pitfalls:
  - flipping CHECK-covered blocks
  - Windows emoji UnicodeEncodeError
  - 3s sleep per request
tools:
  - python-socket
  - pycryptodome (local only)
