signals:
  - Photo contains a QR code leading to a web page hosting a "slot machine" game with visible client-side JavaScript.
  - The JS implements a Linear Congruential Generator (LCG) with fixed A, C, M, SEED constants and a weighted symbol POOL, and ties a "jackpot" outcome's final internal state to an AES-GCM key via SHA256(str(state)).
key_idea: When a client-side "random" game exposes its full PRNG parameters (A/C/M/seed) and a symbol pool in readable JS, the "randomness" is fully simulable offline. Replay the LCG exactly as the page does, spin-by-spin, until the target winning condition (three matching symbols) occurs; the resulting internal state is the key material for decrypting an embedded ciphertext (here AES-GCM with key = SHA256(state-as-string)).
prerequisites:
  - QR code decoding from an image (OpenCV QRCodeDetector)
  - Replicating a client-side LCG exactly (same update order/modulus) to keep state in sync with the real page
  - AES-GCM decryption given key/iv/ciphertext extracted from page source
exploitation_pattern: decode QR -> fetch page -> extract LCG constants, symbol pool, and AES-GCM iv/ciphertext from inline script -> simulate LCG spin-by-spin until the winning condition is hit -> derive AES key as SHA256(state) -> AES-GCM decrypt -> flag.
