signals:
  - A single hex string that decodes through multiple keyless encodings (hex -> base64 -> base32), described as having "been through the encoder a few too many times".
  - After the first base64 decode, the result has `=` padding at the FRONT of the string, not the end — base32/base64 padding is only ever valid at the end.
key_idea: "Decode layer by layer by alphabet/shape recognition (hex = 0-9a-f only; base64 = mixed case+digits with trailing `=`; base32 = A-Z2-7 with trailing `=`). Leading `=` padding after a decode step is the decisive signal that the layer underneath was reversed before being wrapped — reverse the string to restore valid padding-at-end before decoding the next layer."
prerequisites:
  - Familiarity with hex/base64/base32 alphabets and padding rules
exploitation_pattern: hex-decode -> base64-decode -> observe leading `=` padding -> reverse string -> base32-decode -> flag.
