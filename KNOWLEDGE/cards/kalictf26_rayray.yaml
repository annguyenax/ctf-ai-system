    - stack BOF when read length is tiny
    - brute force N when N is large without PRNG model
recipe:
  - reimplement glibc TYPE_3 srandom/random (not Python random)
  - selftest srand(1)->1804289383
  - seed window [now-1, now+1]
  - send predicted index
verify:
  - output contains DATA: and flag format
  - pure python PRNG matches challenge libc for fixed seeds
