signals:
  - "random pattern" / hidden block / many slots
  - PLT: srand, rand, time, fgets, snprintf
  - asks for index/block number after filling array
  - flag written into one of N cells via fgets
decision:
  primary: predict glibc rand()%N after srand(time(NULL))
