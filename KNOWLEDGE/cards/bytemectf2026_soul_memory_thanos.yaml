pitfalls:
  - The supplied loader/libc pair aborts locally; WSL system glibc runs the binary.
  - transfer_soul does not add its record to the archive; exploit through the stale slot from the last merge.
  - Subtract the type-1 callback offset 0x13a9 to derive PIE base; this is not a libc leak.
  - Remote flag recovery does not mean portal acceptance; the portal was not submitted.
