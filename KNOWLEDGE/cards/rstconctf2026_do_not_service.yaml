pitfalls:
  - A 51MB capture is too large to `strings`/manually scan; narrow to the specific protocol (DNS) the title hints at before brute-force searching.
  - Base64-decoding must tolerate garbage/non-base64 subdomains from unrelated legitimate DNS traffic (wrap in try/except).
