  - Large pcapng capture of normal workstation traffic; challenge title "Do Not Service" is a pun on DNS (Domain Name Service/System).
  - DNS queries formatted as `www.<base64-blob>.<tld>`, i.e. exfiltration encoded into a subdomain label.
key_idea: When a pun/title hints at DNS specifically, filter the capture to DNS query records and regex the subdomain labels for base64-shaped tokens rather than scanning all traffic/strings. One query's base64 subdomain decodes directly to a length-prefixed flag (`\x00\x1d` + `rstcon{...}`).
prerequisites:
  - scapy PcapNgReader + DNS layer parsing
  - base64 decoding with graceful failure handling across many DNS queries
exploitation_pattern: parse pcap -> filter DNS query layer -> regex `www.([A-Za-z0-9+/=]+)\.` from qname -> base64-decode each candidate -> grep for `rstcon{` in decoded bytes.
verification:
