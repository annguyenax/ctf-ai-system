pitfalls:
  - "filter='fully_trusted' on tarfile.extractall() disables ALL of Python's built-in archive-extraction safety checks (symlinks, path traversal, device nodes); never use it on attacker-supplied archives -- use 'data' (the safe default added in PEP 706) unless you control the archive source completely."
