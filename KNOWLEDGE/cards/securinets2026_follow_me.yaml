signals:
  - "Service base64-decodes a client-supplied tar archive requiring exactly one member named report.txt, extracts it with archive.extractall(folder, filter='fully_trusted'), then reads and prints report.txt from the extraction folder."
  - "Python's tarfile extraction filter 'fully_trusted' (as opposed to 'data' or 'tar') performs no sanitization of symlinks, device files, or path traversal."
key_idea: "Craft a tar archive whose single member 'report.txt' is a symlink (tarfile.SYMTYPE) pointing at an absolute path outside the extraction folder (/flag.txt); because the server extracts with filter='fully_trusted', the symlink is created as-is, and the server's own 'read report.txt' step follows the link and prints the target file's contents."
prerequisites:
  - "Python tarfile module: TarInfo member types (SYMTYPE) and the extraction filter parameter semantics (fully_trusted vs. data vs. tar, per PEP 706)"
exploitation_pattern: "server extracts an attacker-supplied archive with an unsafe/legacy extraction filter and then reads back a fixed member name -> make that member a symlink to an arbitrary absolute path -> server's read-back step transparently follows the link and discloses the target file."
