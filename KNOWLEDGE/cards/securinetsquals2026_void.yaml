pitfalls:
  - "A seccomp filter installed AFTER secrets are already read into memory does not prevent the secrets from being present -- it only prevents using normal syscalls (read/write/execve) to exfiltrate them; always check whether the filter installation happens before or after sensitive data acquisition."
  - "Shellcode running after every register (including rsp/rbp) has been explicitly zeroed cannot use push/call/ret (rsp==0 faults immediately) -- it must rely entirely on RIP-relative addressing (`lea reg,[rip+disp]`), which is unaffected by the register reset since RIP itself is not zeroed."
  - "Each TCP session in a `pwn.red/jail`-based deployment can have a VERY short hard timeout (observed: 7 seconds) -- any exfiltration strategy requiring many repeated connections must budget for per-connection overhead within that window."
failed_paths:
  - "Classic ORW/execve/SROP shellcode escape techniques are all unavailable: write/read/open/mmap/execve/rt_sigreturn (syscall 15) are all blocked by the filter, and re-mprotect to re-stage code is also blocked since mprotect itself is no longer permitted."
