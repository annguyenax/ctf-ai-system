signals:
  - "The flag is read into a heap buffer BEFORE a restrictive seccomp-BPF filter is installed, so the bytes remain resident in process memory even though the attacker's own shellcode, once running, cannot make any syscall other than `exit` (seccomp filter: `nr==60 -> ALLOW, else -> KILL`)."
  - "Immediately before executing attacker-supplied shellcode, a built-in stub zeroes EVERY general-purpose register (including rsp/rbp) and several xmm/ymm registers, specifically defeating 'read leftover register state' leaks and making any push/call/ret instruction immediately fault (since rsp==0)."
  - "A partial PIE-base leak is printed (only the low 24 bits of a PIE function address via `and eax,0xffffff`), and the shellcode's own landing address is fixed/known (no PIE-base needed for control flow) -- the only remaining challenge is locating the HEAP-resident flag buffer and exfiltrating it using only the single surviving syscall, `exit(code)`."
key_idea: "When a seccomp filter permits literally only `exit(code)` after secrets are already loaded into memory, the sole remaining channel is encoding information IN THE EXIT CODE (or in a crash/no-crash binary signal) itself -- shellcode must use RIP-relative addressing exclusively (since all registers including rsp/rbp are zeroed and rsp is unusable for push/call/ret), locate the flag bytes without any heap-base leak, and call `exit` with a code or trigger a crash pattern that leaks one bit/byte of secret data per execution, requiring many repeated connections (bounded by the jail's short per-session timeout) to exfiltrate the full flag."
prerequisites:
  - "seccomp-BPF filter decoding (classic BPF instruction format)"
  - "RIP-relative-only shellcode construction (no usable stack)"
  - "exit-code/crash side-channel exfiltration design"
exploitation_pattern: "decode the seccomp filter to confirm ONLY exit(60) survives -> write RIP-relative-only shellcode (no stack-based call/ret) to locate the pre-loaded flag buffer in memory without any base-address leak -> design an exit-code or crash/no-crash side channel that reveals one bit or byte of the flag per execution -> repeat across many short (session-timeout-bounded) connections to exfiltrate the full 30-byte flag."
