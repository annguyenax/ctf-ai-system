key_idea: "A binary that mprotects a code region RWX right before calling it is almost always decrypting/unpacking itself at runtime (self-modifying code); statically decrypt the same bytes offline with the adjacent key constant instead of needing to run the (possibly anti-debug) binary, then disassemble the recovered bytes directly."
