signals:
  - "An equivalence certifier uses z3.ZeroExt(WIDTH - SAMPLE_BITS, sample) to extend a smaller symbolic sample before comparing reference vs. submission, then separately a single fixed audit input tests the \"real\" full-width value."
key_idea: "When a formal-equivalence checker widens/zero-extends a smaller symbolic variable to compare against a full-width reference instead of using a full-width free symbolic variable, it only ever proves equivalence over the restricted subspace reachable by that extension (e.g. only inputs whose high bits are all zero) -- build a design that is provably identical to the reference everywhere in that restricted subspace (so the SMT equivalence check returns UNSAT/equal) but diverges sharply (triggers a payload) for a specific full-width value outside the subspace (e.g. one with nonzero high bits), which the later concrete audit will actually exercise."
prerequisites:
  - "Reading the certifier's own source to find exactly which sample width/extension it uses"
  - "A target-domain language or mux-capable ISA to implement an equality-gated trojan (compute reference function normally; mux in a magic constant when input == specific audit value)"
exploitation_pattern: "read verifier.py -> note SAMPLE_BITS < WIDTH and ZeroExt usage -> build submission = mux(input == audit_value, magic_constant, reference_function(input)) -> submit; certify() returns UNSAT because is_target is provably false whenever the top bits are zero -> run with the real audit_value -> mux selects magic_constant -> flag/trojan triggers."
