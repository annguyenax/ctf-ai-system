signals:
  - "Endpoint returns only a binary 'signal detected'/'no signal' indicator with no verbose errors -- classic boolean-blind injection surface."
  - "Appending `' AND 1=1 AND '1'='1` vs `' AND 1=2 AND '1'='1` to the query parameter flips the signal indicator, confirming unescaped string concatenation into a PostgreSQL query."
  - "A table literally named `leak` (alongside the expected `planets` table and oddly-named decoys `pwn9182`, `zleak`) holds exactly one row containing the flag."
key_idea: "A boolean-only (no error/time feedback) blind SQLi oracle is solved by binary-searching each character's ASCII value via `ASCII(SUBSTRING(expr FROM i FOR 1)) > mid` comparisons, first binary-searching the target string's LENGTH the same way; this reduces the full flag extraction to O(length * log(96)) requests and parallelizes trivially per-character since each character's search is independent."
prerequisites:
  - "PostgreSQL string functions (ASCII, SUBSTRING FROM/FOR) usable inside a boolean injection condition"
  - "Binary-search character extraction technique for blind SQLi"
exploitation_pattern: "confirm injectability via a true/false boolean pair -> enumerate pg_tables in the public schema to find non-standard table names -> binary-search the row count and each character's ASCII value of `(SELECT v FROM leak LIMIT 1)` -> parallelize across characters with a thread pool -> assemble the flag"
