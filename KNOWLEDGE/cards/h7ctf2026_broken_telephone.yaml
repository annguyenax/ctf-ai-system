signals:
  - "A Noise-protocol-style mesh (XKpsk3, ChaCha20-Poly1305) advances a length-mask index per transport frame but the AEAD counter/nonce itself never advances, so every frame in one direction reuses the same (key, nonce)."
  - "Keepalive/control frames have an all-zero plaintext, so their ciphertext equals the raw keystream directly."
key_idea: "When an AEAD nonce is stuck/reused across many frames, (1) recover the keystream for free from any frame whose plaintext is known/zero (keepalives), then (2) run the Poly1305 \"forbidden attack\": with >=2 tags produced under the same reused one-time key, treat the two tag equations as a polynomial over GF(2^130-5), solve for the authenticator key r via root-finding (respecting the clamping constraints), derive s, and now you can forge a valid tag for any chosen ciphertext under that nonce."
prerequisites:
  - "Understanding of ChaCha20-Poly1305 construction (keystream, one-time poly key)"
  - "Polynomial root-finding mod a large prime (Cantor-Zassenhaus / gcd with x^p-x)"
  - "Protocol-specific length masking derived from a known transcript hash"
exploitation_pattern: "compute transcript hash to unmask frame lengths -> pull keystream from a known-plaintext (zero) keepalive -> collect multiple same-nonce tags -> solve forbidden-attack polynomial for Poly1305 key -> forge an authenticated privileged control frame (e.g. role=admin) -> inject it; server has no replay protection on the reused nonce so it accepts."
verification:
  method: "Live protocol replay; the forged frame was accepted by the gateway, which responded with the provisioning secret, decrypted with the independently-recovered g2n keystream."
