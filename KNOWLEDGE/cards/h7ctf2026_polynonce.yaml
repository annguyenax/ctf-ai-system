signals:
  - "A batch signer rubber-stamps many messages; the only handout is a set of (r, s, msg) ECDSA signatures over a standard curve (secp256k1) plus a symmetric ciphertext keyed from the private key."
  - "Challenge title/flavor text hints nonces are generated by a recurrence rather than true randomness (\"cut a corner... still signing every approval\")."
key_idea: "If ECDSA nonces follow a polynomial recurrence k_{i+1} = sum(a_j * k_i^j), express each k_i as an affine function of the unknown private key d (from the signature equation k_i = z_i*s_i^-1 + r_i*s_i^-1*d), substitute into an elimination polynomial built from the recurrence relation (the \"dpoly\" construction from the Kudelski DEF CON 31 polynomial-nonce-recurrence talk), and factor the resulting univariate polynomial over F_n to recover d directly -- no brute force needed."
prerequisites:
  - "A polynomial/finite-field library over the curve order (e.g. python-flint fmpz_mod_poly_ctx)"
  - ">= 5 signatures for a quadratic recurrence (more needed for higher-degree recurrences)"
exploitation_pattern: "build k_ij(d) affine polynomials from pairs of signatures -> apply the recurrence-elimination polynomial construction for the assumed recurrence degree -> factor over F_n -> each degree-1 factor gives a candidate d -> verify d*G == pubkey -> derive symmetric key (e.g. SHA256(d)) and decrypt the sealed flag."
verification:
  method: "Deterministic offline computation; recovered d satisfies the public key relation and successfully decrypts flag.enc via AES-256-GCM."
