key_idea: Web challenges that ship a photo attachment alongside a live login portal often hide the login credentials visually in the image (sticky notes, monitors, whiteboards) rather than anywhere in the HTTP traffic — inspect the photo for readable text before trying credential guessing or auth bypass. Once authenticated, standard UNION-based SQLi recovers the flag from an unrelated-looking table (patient records here) after determining column count/types with SELECT 1,2,3...
prerequisites:
  - Visual inspection of attached photos for readable credentials
  - Standard UNION-based SQL injection methodology (error confirmation, column-count probing, schema dump via sqlite_master, targeted table dump)
exploitation_pattern: read credentials from attached photo -> log in -> probe `q` param with `'` for SQL error -> determine column count via UNION SELECT N placeholders -> dump sqlite_master for table names -> UNION SELECT the flag-bearing columns from the target table.
