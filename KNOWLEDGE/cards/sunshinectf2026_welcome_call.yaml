key_idea: "A pcap carrying a VoIP call should be parsed for its SIP/SDP negotiation to find the actual RTP media ports and codec (don't guess), then the RTP payloads reassembled in packet order and decoded per the negotiated codec (G.711 u-law here); if the resulting audio sounds reversed/garbled, try reversing the sample order before assuming it's a different codec or corrupted capture."
