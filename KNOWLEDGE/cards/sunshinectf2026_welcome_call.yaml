exploitation_pattern: "rdpcap -> find RTP UDP stream by negotiated SIP/SDP ports -> strip 12-byte (+CSRC) RTP header from each payload -> concatenate in packet order -> u-law decode each byte to 16-bit linear PCM -> reverse the sample sequence -> write WAV -> listen/transcribe spoken flag"
