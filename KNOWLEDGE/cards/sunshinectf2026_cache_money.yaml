pitfalls:
  - "Safe-linking defeats a naive 'just read the next-pointer' tcache leak; recognize that when a bin has exactly one chunk and its target is 0 (nothing to XOR against), the obfuscated value IS the key, requiring no brute force."
  - "A transfer/move operation that copies a pointer into a still-active destination object while freeing the source is a UAF even if the source object itself is correctly deactivated."
