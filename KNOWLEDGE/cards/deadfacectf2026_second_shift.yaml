signals:
  - Three files given: known plaintext + its ciphertext, and a second ciphertext from the same relay worker/session.
  - Forum chatter explicitly states the relay reuses the same nonce/counter state across packets.
  - AES-CTR (and any stream cipher) ciphertext XORed with its own plaintext recovers the raw keystream.
key_idea: AES-CTR is C = P XOR keystream(nonce,counter); if two messages reuse the same nonce/counter, recovering the keystream from one known-plaintext/ciphertext pair lets you decrypt any other ciphertext encrypted under that same keystream via XOR, with no key recovery needed.
prerequisites:
  - One known-plaintext/ciphertext pair from the vulnerable stream
  - A second ciphertext suspected to share nonce/counter state
exploitation_pattern: keystream = plaintext1 XOR ciphertext1 -> plaintext2 = ciphertext2 XOR keystream (byte-wise, equal-length prefix).
verification:
