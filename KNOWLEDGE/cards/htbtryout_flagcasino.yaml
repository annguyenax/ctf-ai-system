pitfalls:
  - "Don't hand-reimplement glibc's rand()/srand() internals from memory; subtle details (309-value discard on seed, additive-feedback generator state, pointer wraparound) are easy to get wrong. Measure the real library's output directly instead."
  - "A single-byte seed (srand(char)) collapses the keyspace to 256 values regardless of how 'random' rand() otherwise looks -- this is the actual vulnerability, not the PRNG algorithm itself."
