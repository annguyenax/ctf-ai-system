signals:
  - "For each of 29 rounds, the binary does srand(single_input_byte); then compares rand() against a fixed per-round constant from a hardcoded array."
  - "srand() takes only a single byte of input, so the entire per-round seed space is 256 values, trivially brute-forceable."
  - "The binary is unstripped with intact symbol names (main, check, banner), so objdump alone (no decompiler) is sufficient to read the logic."
key_idea: "Rather than reimplementing glibc's rand() algorithm by hand (error-prone: discard counts, pointer wraparound, etc.), measure the ground-truth seed->rand() mapping by compiling and running a tiny C program against the real glibc for all 256 possible seed bytes, then invert that table against the binary's 29 hardcoded target values to recover each flag character deterministically."
prerequisites:
  - Unstripped binary with readable constant-comparison logic (pyelftools/objdump sufficient)
  - Access to compile and run a tiny C program against the real matching glibc
exploitation_pattern: "extract 29 hardcoded rand()-check constants from .data -> build seed(0..255)->rand() ground-truth table from real glibc -> invert table per position, filtering to printable ASCII -> concatenate recovered bytes"
