pitfalls:
  - "ROPgadget hits that land in .rodata (not .text) are unusable under NX; verify every gadget address falls inside the executable text segment before building the chain."
  - "A UAF introduced by a custom RCU wrapper is not caught just by auditing the free function itself -- check every OTHER data structure (here, a separate snapshot/tracking array) that might still hold a pointer to the object after it's freed."
  - "When reclaiming a freed slot via heap spray, stop at the first usable contiguous allocation run to guarantee landing on the same (live) cpu slab rather than a freshly refilled one."
