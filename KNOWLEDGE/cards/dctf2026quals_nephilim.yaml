signals:
  - "nkrcu_remove() unlinks a kmalloc-128 descriptor from a list and defers the free via call_rcu()/kfree, but never clears the pointer held in a separate nk_snaps[] tracking array."
  - "A periodic timer callback (nk_mon_cb, every ~5s) dereferences that still-tracked descriptor and performs an indirect call fn = desc->ops[0]; fn(desc) with desc in rdi -- a live indirect-call-through-freed-memory primitive."
  - "An info() leak path exposes _printk (for KASLR) and a stack-pivot gadget (nkrcu_pivot: mov rsp,[rdi]; ret) once the freed slot is reclaimed with attacker data."
key_idea: "Reclaim the freed kmalloc-128 descriptor (via a controlled spray, stopping at the first contiguous reusable run so the reclaim lands on the live cpu slab) with a crafted fake descriptor whose ops[0] is the stack-pivot gadget and whose first field is a fake rsp; the periodic monitor callback then calls through the stale nk_snaps[] pointer with rdi=the reclaimed memory, pivoting the stack into an attacker-built kROP chain (filp_open + kernel_read + msleep, kept inside executable .text, not NX .rodata) that opens and reads /flag into process-visible descriptors recovered by a subsequent info() leak."
prerequisites:
  - "Linux kernel UAF exploitation (RCU-deferred free vs. stale external pointer arrays)"
  - "Kernel ROP / stack pivot technique via an indirect-call primitive invoked from a timer/periodic callback"
  - "KASLR defeat via a kernel symbol leak (_printk) and gadget-offset arithmetic"
exploitation_pattern: "free a kmalloc-sized object but leave a stale pointer to it in an unrelated tracking array -> periodic/async code later calls an attacker-controlled function pointer through that stale pointer -> spray to reclaim the exact freed slot on the live slab -> plant fake vtable + pivot target -> kROP (filp_open/kernel_read/msleep, in .text only) -> read flag into reachable descriptors -> leak via existing info() primitive."
