key_idea: >-
  On PHP 8.4.16, new DateTimeImmutable('@ts') and createFromFormat('U') disagree
  around year 0: the '@' path maps both Unix days [-62164800000, -62164627200)
  to partition date 0000-01-29 (a 172800-second day) while createFromFormat
  rolls to 0000-01-30 at -62164713600. Nonce input uses the '@' date; the signed
  message uses the createFromFormat date. Same seat + ts=-62164800000 and
  ts=-62164713600 therefore produce two distinct messages signed with the same
  nonce (identical r) -> classic ECDSA repeated-nonce private key recovery ->
  forge winner=true ticket -> QR -> /check returns the flag.
prerequisites:
  - "ECDSA repeated-nonce recovery: k=(z1-z2)/(s1-s2), d=(s1*k-z1)/r mod n"
  - "PHP DateTime behavior differences for negative timestamps"
exploitation_pattern: >-
  Scan the pinned runtime (download exact-version binary if needed) over the
  full accepted timestamp range for f(x)==f(y) && g(x)!=g(y) between the two
  date functions; buy the colliding ticket pair (same seat); decode QRs from
  /ticket.png (zbarimg); recover d; verify by re-signing; forge the privileged
  envelope with a fresh nonce; render QR (python qrcode) and POST to /check.
