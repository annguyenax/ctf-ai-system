pitfalls:
  - "Don't assume a lazy-import-based puzzle needs re-implementation from scratch -- installing the exact (even prerelease) interpreter version and importing the real modules directly is far more reliable than hand-modeling materialize-once caching semantics."
  - "Before suspecting a 'traversal order' bug in a toggle-based maze, check whether the toggle operation is commutative (XOR/symmetric_difference) -- if so, a single deterministic fixed-point computation is conclusive and re-running with different random orders wastes time."
