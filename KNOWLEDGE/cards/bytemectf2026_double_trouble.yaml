signals:
  - Two RSA key/ciphertext pairs (n1,e1,c1) and (n2,e2,c2) with e=65537, different n.
  - gcd(n1, n2) is non-trivial, i.e. the two "independent" keys were generated with a shared prime.
key_idea: When two RSA moduli are given together, always try gcd(n1, n2) first; a non-trivial result fully factors both moduli (p = gcd, q = n/p), after which both plaintexts are recovered with the standard private exponent. The final plaintext layer here was base64-of-ciphertext XORed with the second recovered message used as a short repeating key.
prerequisites:
  - Basic RSA math (CRT-free private exponent from p,q,e)
  - Recognize chained encoding (base64 then XOR) in final plaintext
exploitation_pattern: shared-prime RSA (gcd(n1,n2)=p) -> factor both moduli -> decrypt both ciphertexts -> base64-decode one -> XOR with the other as key -> flag.
