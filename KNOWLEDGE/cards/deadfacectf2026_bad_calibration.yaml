confidence: 1.0
artifact_hashes: []
signals:
  - A simulated device exposes a shell (`/api/shell`) and lets you mount and read its own config partition.
  - "verify.py source is readable on-disk: `sha256(data + salt)` where `salt` is a plaintext value in config.yaml."
  - Tampering integrity is only a hash check with a static, locally-readable salt, not a signature.
key_idea: When the "integrity check" is a plain hash over attacker-editable data plus a salt that is also attacker-readable, you can edit the protected file and recompute a valid signature yourself; the check was never tamper-proof.
prerequisites:
  - Shell/file access to the device's config and verifier source
  - Ability to read the salt value used by the hash
exploitation_pattern: read verify.py -> locate hash(data+salt) formula -> read salt from config -> edit protected file -> recompute hash -> overwrite signature file -> re-run verifier to confirm acceptance.
verification:
  method: Solver script ran scanctl verify (returned OK) then scanctl scan, which printed the tampered result and the flag in the scan log.
  evidence: "D:/download/CTFTimeWriteup/DeadfaceCTF2026/BrainScans/Bad Calibration/writeup/writeup.md"
pitfalls:
  - A keyed hash is not an integrity signature unless the key is kept secret from the party being checked; if the verifier and the data live on the same box you control, the key is not secret.
  - Must recompute the hash over the *exact* tampered bytes (not re-serialized JSON) or the signature mismatches.
