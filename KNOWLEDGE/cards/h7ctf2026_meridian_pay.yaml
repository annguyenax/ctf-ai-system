time_heuristic: "Decompile the mobile client fully before touching the API blind -- look specifically for (a) a hardcoded \"attestation\"/integrity header string, (b) WebView code that forwards the bearer token to server-supplied URLs (revealing hidden endpoints), and (c) any PATCH/PUT handler that writes whole request bodies without an allowlist (mass assignment); these three combine in many \"neobank\"-style mobile challenges, but a device/app-layer exported-component flaw (ContentProvider traversal, weak URL-prefix check on a deep link) typically needs real device/emulator interaction and not just API replay."
