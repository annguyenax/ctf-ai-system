signals:
  - "A GraphQL mutation for verifying a short numeric OTP is rate-limited \"per HTTP request\", and the client-side JS even comments that this is exactly what alias batching defeats."
  - "A dashboard \"directive\" parameter is include()d server-side after a prefix check, but path traversal past that prefix is still permitted (LFI), with verbose PHP warnings/open_basedir leaking the include base path."
key_idea: "Chain several classic web primitives: (1) GraphQL endpoints that rate-limit \"per request\" rather than per field are trivially defeated by batching thousands of aliased mutation calls (a0: op(...) a1: op(...) ...) into ONE request, brute-forcing an entire keyspace (e.g. a 5-digit OTP) in seconds via a handful of large concurrent requests; (2) a directory-prefix-checked include/LFI parameter that still allows ../ traversal AFTER the required prefix lets you read arbitrary readable files, including the web server's own access log; (3) poison that access log by putting a PHP payload in your User-Agent header, then LFI-include the poisoned log to achieve RCE via system($_GET['cmd']) (which bypasses open_basedir since system() isn't restricted by it); (4) pivot further by harvesting another user's credentials from a world-readable config/script to reach an internal-only service holding the flag."
prerequisites:
  - "A GraphQL schema exposing a brute-forceable mutation (short numeric code) with per-request rather than per-call rate limiting"
  - "A path-prefix-checked include parameter that still permits ../ traversal"
  - "Write access to a value the server later logs verbatim (e.g. User-Agent)"
exploitation_pattern: "GraphQL-introspect for the OTP mutation -> batch thousands of aliased calls per request across many concurrent requests sharing the session cookie -> winning alias flips session to 2FA-verified -> find the directive/include LFI and traverse to the server's own access log -> poison User-Agent with a PHP webshell snippet -> LFI-include the poisoned log with a cmd parameter for RCE -> enumerate further for a privileged credential -> reach the internal service gated by it for the flag."
