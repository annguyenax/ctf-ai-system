pitfalls:
  - "A rate limit implemented \"per request\" rather than \"per logical operation\" is not a rate limit against GraphQL alias batching -- always check this before assuming a code-guessing attack is infeasible."
  - "A directory-prefix check on an include/LFI parameter does not stop path traversal that starts AFTER the required prefix string."
