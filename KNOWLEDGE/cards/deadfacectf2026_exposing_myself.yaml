signals:
  - Target runs a self-hosted HTTPS service on a non-standard port discovered in a prior OSINT step.
  - The server's self-signed/custom TLS certificate's Subject fields (O=, OU=) contain operator-chosen free text rather than a real org name.
key_idea: A self-signed or custom TLS certificate's Subject (and Issuer) fields are attacker/operator-controlled free text — when a target's bad OPSEC involves running their own TLS service, always pull and inspect the raw certificate DER/text for planted strings, not just the page content behind it.
prerequisites:
  - Target host:port already identified (often from a prior challenge/OSINT pivot)
exploitation_pattern: open a TLS socket to host:port with cert verification disabled -> getpeercert(binary_form=True) -> regex scan the DER bytes (or parse ASN.1 Subject fields) for the flag pattern.
verification:
