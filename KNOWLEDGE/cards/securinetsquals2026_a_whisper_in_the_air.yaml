key_idea: Demux interleaved BLE connections by Access Address. Brute-force 6-digit legacy PIN (483209) against confirm/random pairs using c1. Compute STK via s1 and decrypt the initial pairing link to recover the distributed LTK (opcode 0x06) and EDIV/Rand (opcode 0x07). Derive session key for the reconnection link (3c34ec3d) using recovered LTK. Reorder decrypted packets by AES-CCM packet counter, extract HID keycodes, remove duplicates, and decode the base64-encoded keystroke payload.
exploitation_pattern: Demux AA -> Brute-force PIN (c1) -> STK (s1) -> Decrypt pairing session (AES-CCM) -> Extract LTK -> Re-derive session key on reconnect -> Decrypt HID keystrokes -> Base64 decode
