time_heuristic: "When a Setup/Vault pattern funds a vault in its constructor, check whose address is credited by internal bookkeeping (msg.sender during Setup's call is Setup itself, not the player) versus who holds privileged roles (relayer/owner) — a mismatch there is often the entire bug, with no reentrancy or cryptography needed."
