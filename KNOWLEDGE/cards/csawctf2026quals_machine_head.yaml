signals:
  - "Binary interprets a custom byte-triple [opcode, op1, op2] instruction set from a static .rodata blob instead of using native opcodes."
  - "Opcodes map to simple register ops (load flag byte, xor/add/mul const or register, rotate, equality-check, halt) -- all straightforwardly symbolically executable."
  - "638 instructions total -- too many to invert by hand in reasonable time, but trivial to model symbolically."
key_idea: "A custom-VM 'crackme in a language you won't find in any disassembler' is best solved by writing a tiny symbolic interpreter for the VM's few opcodes in Z3 (one BitVec per flag byte, one constraint per equality-check opcode) rather than manually reverse-engineering hundreds of bytecode instructions."
prerequisites:
  - "Z3 SMT solver (BitVec modeling)"
  - "Ability to statically extract/read the bytecode blob from the binary"
exploitation_pattern: "identify bytecode pointer/offset in .rodata -> enumerate opcode semantics from a handful of representative instructions -> build Z3 BitVec(8) per flag char with ASCII-range + known prefix/suffix constraints -> symbolically execute the whole instruction stream, adding an equality constraint for each check opcode -> solve -> decode flag bytes from the model"
