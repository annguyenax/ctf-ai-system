key_idea: "Even when a WHERE clause prevents a row from ever appearing in the output, an ORDER BY CASE WHEN (condition) THEN ... END expression still evaluates the condition against hidden rows via a scalar subquery, turning sort order of a visible anchor row into a binary oracle; binary-search the secret's length then each character with length()/unicode()/substr()."
