pitfalls:
  - "A shared single headless admin bot can be fragile and crash after only ~2-3 note loads per challenge instance -- batch the per-character candidate set into as few notes/bot-visits as possible (light CSS payload, small charset) rather than one bot visit per character."
  - "If multiple users/agents share the same scarce admin-bot capacity, contention from other actors burns through bot loads without producing results -- coordinate or serialize access."
  - "Once partial plaintext becomes guessable (e.g. recognizable English/leetspeak substrings), skip ahead by hand and let the oracle only verify the guess, saving expensive bot-visit budget instead of exhaustively exfiltrating every remaining character."
  - "Use one combined URL-aware charset for the whole secret rather than a light-then-extended two-phase charset split -- the two-phase approach wastes an entire bot load whenever a special character outside the light set appears."
