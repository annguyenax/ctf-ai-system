  - "A secret value sits in a hidden input (#flag-holder) that only the admin bot's page render actually populates; the attacker's own view shows a redacted placeholder."
  - "The CSS attribute-selector prefix matcher ([value^=\"...\"]) combined with the general-sibling combinator (~) can bridge a hidden secret-bearing element to a visible sibling element, letting a background:url() on the visible sibling fire conditionally on the hidden element's attribute value."
key_idea: "Blind CSS exfiltration: inject <style> rules using attribute-selector string-prefix matching ([value^=\"prefix\"]) on a hidden secret input, combined via the ~ sibling combinator to a visible sibling whose background-image URL only loads when the prefix matches. Batch one candidate character per out-of-band collector query per note, submit the note to an admin bot that renders the real secret, then poll the collector log to see which single candidate fired -- repeat per character to exfiltrate the whole secret through a CSP that blocks JS but allows inline CSS."
prerequisites:
  - "An admin bot (or any victim) that renders attacker-supplied HTML containing the real secret value, while the attacker's own view is redacted"
  - "A same-document DOM layout where the secret element and a background-fetching visible element are siblings (or otherwise reachable via a CSS combinator)"
  - "An out-of-band collector endpoint (here provided by the challenge) to observe which background request fired"
exploitation_pattern: "CSP allows unsafe-inline style-src and sanitizer preserves <style>/style= -> attribute-selector prefix oracle on a hidden secret input -> sibling combinator bridges hidden element to a visible background-fetching element -> one correct candidate per batch fires a distinct collector URL -> report to admin bot -> poll collector -> repeat per character/position to reconstruct the full secret."
