pitfalls:
  - "An RC4 cipher whose decrypted plaintext starts with the expected magic bytes (e.g. `7f454c46` ELF magic) when using the LITERAL challenge-name string as the key is a strong correctness signal -- don't assume a more complex key derivation is needed if the obvious string already produces a structurally valid result."
  - "Patching only a symbol's `.gnu.version` index to point at an available version string is NOT enough if the loader also validates the version's name/hash via a separate `vernaux` table entry -- both must be changed together or the dynamic linker will still reject the binary."
  - "A binary's anti-ptrace check can trigger on ANY tracer, including a renamed copy of `strace` run as a normal child -- but the SAME binary executed under a parent process whose `comm` happens to match an expected name (e.g. `init`) does not trigger it, suggesting the check inspects parent identity/environment rather than literally detecting ptrace; a seccomp USER_NOTIFY filter sidesteps the question entirely since it never sets TracerPid."
