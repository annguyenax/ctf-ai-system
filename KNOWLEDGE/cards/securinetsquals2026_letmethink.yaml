signals:
  - "An ELF stub decodes its own syscall numbers via XOR with a constant, then uses `memfd_create`+`write`+`execveat(AT_EMPTY_PATH)` to decrypt and directly execute an inner, much larger ELF entirely in memory (no file ever touches disk) -- the RC4 key is simply the literal ASCII string 'letmethink', but the initial S-box is a non-identity permutation embedded as 16 SIMD-sized blocks in a specific file-offset order that must be reconstructed before running standard KSA/PRGA."
  - "The inner ELF is a Go binary (garble-obfuscated, no real version string) requiring GLIBC_2.44 for `sinh`/`cosh`, which the available Linux environment doesn't have -- patching only the `.gnu.version` index for those two symbols is insufficient; the corresponding `vernaux` entry (version name+hash) must ALSO be repointed to an available version (e.g. GLIBC_2.2.5) for the dynamic linker to accept the patched binary."
  - "Running the inner binary under `strace` (or any tool, even renamed, whose own comm name isn't masquerading as 'init') triggers a 'wrong os version' anti-ptrace branch; a seccomp-BPF USER_NOTIFY filter that only intercepts `openat`/`write`/`exit`/`exit_group` (ALLOWing everything else, including `execve`) lets you observe syscall traffic WITHOUT setting TracerPid, bypassing that specific anti-debug check."
key_idea: "Layered anti-analysis (self-decrypting memfd+execveat ELF launcher, a Go binary requiring a newer GLIBC than available, and a ptrace-detecting inner binary) can each be defeated by a narrowly-scoped technique: reconstruct a scrambled RC4 S-box from its exact on-disk block order rather than assuming identity init; patch BOTH the `.gnu.version` index AND its corresponding `vernaux` entry (not just one) to downgrade a required symbol version the local loader lacks; and use a seccomp USER_NOTIFY filter limited to only the syscalls you need to observe, since it does not set TracerPid and so evades a ptrace-based anti-debug check that a normal strace/gdb session would trigger."
prerequisites:
  - "ELF overlay/memfd+execveat self-launch pattern"
  - "RC4 KSA/PRGA with non-identity initial S-box"
  - "ELF symbol versioning (.gnu.version/.gnu.version_r/vernaux) internals"
  - "seccomp-BPF SECCOMP_RET_USER_NOTIFY for ptrace-free syscall observation"
exploitation_pattern: "locate the overlay after the ELF section-header table and decode its syscall-number XOR obfuscation -> reconstruct the RC4 S-box from the exact file-offset block order and RC4-decrypt with the literal key -> on the inner ELF, patch both gnu.version index AND vernaux hash/name for the unsupported GLIBC_2.44 symbols to a locally-available version -> run under a seccomp USER_NOTIFY filter (not strace/gdb) limited to a few syscalls to observe behavior without triggering the anti-ptrace branch -> the final observed write() payload is itself a 'no alphabetic characters' Python pyjail string (`exec(str(eval)[...])`) requiring further static decoding."
