signals:
  - "phi = (p^10 - 1) * (q^10 - 1) and e = inverse_mod(phi - d, phi), with a deliberately small bounded d."
  - "ed + 1 = k*phi for small k and d, exactly the Wiener continued-fraction shape, but scaled to N^10 instead of N."
  - "phi = N^10 + 1 - (p^10 + q^10), so phi is an extremely accurate approximation of N^10 at the scale needed for the convergent search."
  - "Plaintext is a polynomial in (Z/NZ)[t]/(t^10-2); naive use of phi-d as the decryption exponent does NOT re-encrypt correctly because t^10-2 is reducible mod p and mod q."
key_idea: "This is Wiener's small-private-exponent attack generalized to a quotient-ring RSA variant: because e = inverse_mod(phi-d, phi) with the unusual modulus (p^10-1)(q^10-1), ed+1=k*phi still holds, and k/d is recoverable as a continued-fraction convergent of e/N^10 (N^10 approximates phi closely enough). Once candidate phi gives integer p^10+q^10 with exact tenth roots, factor N. Then compute the TRUE quotient-ring decryption exponent via lcm of (r^deg(f)-1) over the factorization of t^10-2 mod each prime, not naively via phi-d."
prerequisites:
  - "Continued-fraction / Wiener-attack reasoning generalized beyond modulus N"
  - "python-flint or Sage for exact large-integer polynomial factorization over finite fields"
  - "Quotient-ring RSA / finite-field extension exponent (Euler totient analog) understanding"
exploitation_pattern: "small-d RSA variant -> ed+1=k*phi -> continued fraction of e/N^10 recovers k/d -> factor N via p^10+q^10 -> recompute real decryption exponent from factorization of the quotient polynomial, not from phi-d."
