  - "Bundled engine runtime data (Unicode/ICU locale databases, test corpora) can contain large amounts of real-world English text that coincidentally matches a challenge's narrative keywords -- always scope keyword searches to the identified payload/data byte range, not the whole binary, to avoid chasing false positives."
