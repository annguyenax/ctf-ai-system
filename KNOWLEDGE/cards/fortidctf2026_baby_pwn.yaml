signals:
  - "mark_favourite() caches a raw pointer to a heap object in a global; delete_review() frees that object but never clears the global."
  - "A second allocation of the exact same size (write_draft, 40 bytes) reclaims the freed tcache chunk and lets attacker-controlled bytes land at the same address."
  - "preview_favourite() calls favourite->display(favourite), an indirect call through the first 8 bytes of attacker-controlled data."
key_idea: "Classic UAF via stale global pointer: free the tracked object without clearing the alias, reallocate the same tcache size with fully attacker-controlled bytes, overwrite the vtable-like function-pointer field with the address of a fixed win() function, then trigger the stale call."
prerequisites:
  - ELF without PIE (fixed win() address)
  - Tracking allocation sizes across menu operations to predict tcache reuse
exploitation_pattern: "free(tracked_obj) without clearing alias -> same-size malloc reclaims chunk -> overwrite function-pointer field -> call through stale alias"
verification:
  method: "Remote TCP exploit script ran the menu sequence and the server printed the flag."
