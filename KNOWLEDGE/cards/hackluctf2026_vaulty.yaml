time_heuristic: "When a Go (or any managed-language) binary calls into native C code across an FFI boundary for a KDF/crypto step, check whether the native side treats a binary buffer as a C string (strlen) -- this single-bug pattern can collapse a 256-bit key's effective entropy to a handful of bytes."
