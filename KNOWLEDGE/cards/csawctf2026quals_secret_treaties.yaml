pitfalls:
  - "Try multiple lattice scaling constants C and LLL delta values (the solver tried C in {1, 10^12, 2, 4} and delta in {0.99, 0.75}); a single fixed scaling may fail to produce a usable short vector for every block."
  - "One block in this challenge needed a partial fallback: fixing a known plaintext prefix, subtracting its contribution, and re-running LLL on the remaining reduced sub-knapsack."
