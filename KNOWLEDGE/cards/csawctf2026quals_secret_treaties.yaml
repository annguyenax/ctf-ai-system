signals:
  - "Public key is a Merkle-Hellman-style subset-sum (knapsack) scheme: ciphertext = sum of public-key entries selected by plaintext bits."
  - "Knapsack density d = n / log2(max(a_i)) approx 0.72, well below the Lagarias-Odlyzko/CJLOSS threshold (~0.9408) for low-density knapsacks."
  - "Each 72-bit block (9 bytes) is encrypted independently as one large integer sum."
key_idea: "A subset-sum / knapsack public-key cryptosystem with density below ~0.9408 is solvable in polynomial time via LLL lattice reduction on the CJLOSS lattice, recovering the 0/1 selection vector per ciphertext block directly, without the private trapdoor."
prerequisites:
  - "Lattice basis reduction (LLL) via python-flint or SageMath"
  - "Knapsack density calculation to recognize the low-density regime"
exploitation_pattern: "compute density d = n/log2(max(a_i)) -> confirm d < 0.9408 -> build (n+1)x(n+1) CJLOSS lattice (diag 2 + scaled pubkey column, all-ones row + scaled ciphertext) -> LLL-reduce -> find a +/-1 short vector with zero last column -> map to 0/1 bits -> verify sum(bits*pubkey) == ciphertext -> repeat per block"
verification:
  method: "Deterministic LLL recovery per block, each candidate verified by recomputing the subset sum against the given ciphertext before accepting it."
