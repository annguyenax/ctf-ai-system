pitfalls:
  - "Key-difference validators that check equality, multiset, or XOR-complement can all be satisfied simultaneously by two different constant keys, because none of them test permutation invariance."
  - "Must keep the same TCP session across the encrypt and decrypt prompts since server state (loaded flag ciphertext) does not persist across reconnects."
