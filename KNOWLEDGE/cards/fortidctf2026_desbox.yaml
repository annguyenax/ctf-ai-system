signals:
  - "load_key() permutes a user-supplied N-byte key before XOR with a secret MASK."
  - "Key-pair validators compare equality, effective-byte multisets, and bitwise complement of the two keys, but never check whether a key is a fixed point of the permutation."
  - "The oracle server keeps session state across a FLAG-encrypt command and a separate decrypt-oracle command."
key_idea: "A key made of one repeated byte is invariant under any byte-position permutation, so permute(c^N)=c^N deterministically regardless of the secret shuffle seed. Two such constant keys (e.g. 0x00^N and 0x02^N) differ from each other and are not complements, so they pass every pairwise validator while both still resolving to attacker-predictable post-permutation values; use one as the encrypt key and the other as the decrypt key in a second session to turn the encrypt step into a decrypt oracle for the flag ciphertext."
prerequisites:
  - Reading the key-validation logic (equality/multiset/complement checks) before attacking the primitive
  - Session-stateful oracle interaction (two sequential encrypt/decrypt calls)
exploitation_pattern: "repeated-byte key -> permutation invariant -> bypasses pairwise key-difference validators -> encrypt(key_a) then decrypt(key_b=key_a-equivalent) recovers plaintext"
verification:
