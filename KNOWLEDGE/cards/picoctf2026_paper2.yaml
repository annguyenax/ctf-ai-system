signals:
  - Uploaded files are stored at /paper/<id> and visited by a headless Chrome bot.
  - Bot receives a SameSite=Strict cookie named secret.
  - /secret reflects the cookie into body/@secret and response text.
  - CSP disables script-src but permits same-origin inline HTML/CSS primitives.
  - External navigation is blocked, so the original webhook-only route is patched.
key_idea: Use an XML document with an inline XSLT stylesheet to call document('/secret') and interpolate body/@secret into a same-origin PDF iframe fragment. The PDF has AcroForm JavaScript that reads its URL and submits it to a webhook. Redeem the recovered 32-hex secret at /flag.
exploitation_pattern: upload PDF stage -> upload XML/XSLT stage -> /visit XML -> PDF URL fragment contains secret -> webhook receives fragment -> GET /flag?secret=<secret>
