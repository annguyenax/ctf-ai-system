pitfalls:
  - Stopping after the first LSB decode pass misses a nested encoding; always scan the whole decoded buffer (or every line) before concluding the image carries no more than noise.
  - The XOR key was never given explicitly in the files — it had to be guessed from the challenge's narrative theme (series name "Vormir"), which is a pitfall of the challenge design worth flagging for similar lore-themed sets.
