signals:
  - PNG image whose sequential RGB-channel LSBs decode to readable multi-line text rather than the flag directly.
  - First decoded line is noise/header; a later line is a base64 token; a themed word (from challenge lore) works as a short repeating XOR key.
key_idea: When LSB extraction from an image yields text instead of an immediate flag, don't stop at the raw bytes — split the decoded bytes into lines and inspect each one; a base64-looking line is a second encoding layer, and a short XOR key is often a lore/theme word from the challenge title (e.g. "VORMIR") rather than something recovered from the image itself.
prerequisites:
  - Standard sequential LSB extraction (R,G,B bits per pixel, MSB-first byte packing)
  - Recognizing base64 alphabet/padding and layered XOR-with-short-key patterns
exploitation_pattern: extract LSBs sequentially -> decode to bytes -> split into lines -> isolate base64 token -> base64-decode -> XOR with thematic short key guessed from challenge name/lore -> flag.
