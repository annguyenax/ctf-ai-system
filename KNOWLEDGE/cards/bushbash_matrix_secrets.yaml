category: misc/embedding-lora-secret-extraction
challenge_name: matrix_secrets
status: solved
flag: "bushbash{vect0rl3ak}"
key_idea: >
  The adapter fine-tunes only embed_tokens, so the learned secret is visible in the embedding deltas rather than in full transformer weights. Computing the LoRA delta and ranking embedding-column norms exposes the memorized tokens. Repeated sampling with prompts like "The code" or "The launch" surfaces the flag.
prerequisites:
  - safetensors inspection
  - LoRA delta math
  - prompt-based generation
exploitation_pattern: >
  Inspect adapter tensors -> compute $\Delta W = (\alpha/r)BA$ -> rank token deltas -> use the suspicious vocabulary in prompts -> recover the hidden flag.
pitfalls:
  - naive generation alone may look degenerate
  - the adapter only changes embedding layer, so static analysis matters more than full-model generation
