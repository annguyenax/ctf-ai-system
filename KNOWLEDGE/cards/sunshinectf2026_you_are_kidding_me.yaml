pitfalls:
  - "An explicit protected-file allowlist/denylist checked via os.path.realpath correctly blocks path-traversal to the REAL key files and the flag file directly, but does nothing to stop the kid-as-key-material confusion against any OTHER readable file -- a denylist on the exact secret files does not close the broader kid-controls-the-key-source vulnerability class."
