key_idea: >
  The seed depends only on int(time.time()) (MT19937 seeded with whole seconds).
  The published sha256(seed) is a verification oracle: brute a small window of
  integer seconds, recompute random.Random(t).randbytes(16).hex(), match the
  commitment, then predict every roll and guess 5 in a row.
prerequisites:
