pitfalls:
  - "A narrowed/truncated pointer-leak primitive (e.g. casting a 64-bit pointer through a 16-bit type before shifting) can look like a useful info leak but may expose far fewer usable bits than it appears -- always check the exact cast widths before assuming an info leak defeats a given mitigation."
  - "Counting available allocation slots against tcache capacity (per-size-class, 7 default) matters: too few live/freed slots to fill tcache rules out certain smallbin/largebin stash tricks in one malloc call."
failed_paths:
