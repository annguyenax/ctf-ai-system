signals:
  - "delete() frees nikkis[idx] but never clears nikkis[idx]/sizes[idx] to NULL/0, leaving a dangling pointer."
  - "edit() writes read(0, nikkis[idx], sizes[idx]) with no NULL check, so it writes directly into the freed chunk -> UAF write that can corrupt the tcache 'next' safe-linked pointer and zero the tcache key field, enabling a double-free."
  - "predict() leaks heap pointer bits but casts the 64-bit pointer to unsigned short before shifting right by 12, so it only recovers 4 bits (bits 12-15) of the address -- not enough to beat glibc 2.42 safe-linking (which needs the pointer's bits 12-19 or 12-27) without brute force."
key_idea: "Classic UAF + double-free primitive is clearly present (free without nulling pointer/size, then unchecked write-after-free into the freed chunk), but the one available leak (predict()) is deliberately crippled by a narrowing cast that destroys all but 4 address bits, which is insufficient against glibc 2.42 safe-linking tcache protections and per-thread tcache key verification. With only 7 allocation slots, there is not enough capacity to fill tcache and leverage smallbin/largebin leftovers in a single malloc call either. Exploitation was blocked at the leak stage; no flag was recovered."
prerequisites:
  - "glibc 2.42 heap internals: safe-linking tcache next-pointer obfuscation, per-thread tcache key double-free detection"
  - "ASLR/heap-layout reasoning (PIE-heap gap size, 2MB-aligned libc region from transparent huge pages)"
exploitation_pattern: "free-without-null -> use-after-free write corrupts tcache next/key -> double-free potential, BUT the only address leak available truncates the pointer to 4 usable bits, which is below the threshold needed to defeat glibc 2.42 safe-linking without ASLR brute force (out of scope)."
