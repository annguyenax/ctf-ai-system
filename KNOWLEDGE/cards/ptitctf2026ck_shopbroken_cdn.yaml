signals:
  - "SESSION_KEY = bytes.fromhex(os.environ['SESSION_KEY'])"
  - "AES.new(SESSION_KEY, AES.MODE_CBC, iv).encrypt(pad(build_plaintext(...), 16))"
  - "build_plaintext = 'brand=ShopBroken;role=' + role + ';uid=1001;exp=' + TOKEN_EXP + ';u=' + user"
  - "open_session checks only role in ROLES and exp >= now (no MAC, no brand check)"
  - "login mints token with role='guest' for demo:demo / guest:guest"
key_idea: >
  Session cookie = base64(iv || AES-CBC-ct) with NO MAC. CBC gives P[i] = D(C[i]) XOR C[i-1],
  so flipping bits in C[0] flips the same positions in P[1]. The word "guest" sits in
  plaintext block 1 bytes 6..10, so XOR ct[6:11] with "guest"^"admin" turns role into
  admin. Block 0 ("brand=ShopBroken") becomes garbage but is never validated, and the
  padding block is untouched, so unpad still succeeds. /admin then leaks the flag.
prerequisites:
  - AES-CBC
  - bit-flip malleability / no-MAC session tokens
  - plaintext layout from source
exploitation_pattern: >
  login demo:demo -> session cookie -> blob=b64decode; ct=blob[16:];
  mask=zip(b"guest",b"admin") XOR; ct[6+i]^=mask[i]; resend -> GET /admin -> flag.
verification:
